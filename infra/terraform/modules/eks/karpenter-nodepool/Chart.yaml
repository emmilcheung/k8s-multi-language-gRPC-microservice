apiVersion: v2
name: karpenter-nodepool
description: >-
  Karpenter NodePool and EC2NodeClass for the ticketing cluster.
  Packaged as a chart rather than kubernetes_manifest resources because
  kubernetes_manifest reads a CRD's schema at plan time, which cannot work on
  the apply that installs the CRDs.
type: application
version: 0.1.0
appVersion: "1.0"
