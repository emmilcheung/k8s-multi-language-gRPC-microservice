apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Track the latest AL2023 release for the cluster's Kubernetes version rather
  # than pinning an AMI id. Node expiry below is what actually applies the
  # patches; an alias with no expiry would leave long-lived nodes on the image
  # they first booted.
  # The alias carries the AMI family, so there is no separate amiFamily field
  # in the v1 API.
  amiSelectorTerms:
    - alias: al2023@latest
  role: {{ .Values.nodeIamRole | quote }}
  # Discovery, not enumeration: the VPC module tags the private subnets and the
  # EKS module tags the node security group with this same value. A node that
  # lands in a public subnet is the failure this prevents.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  # NOT VERIFIED against a real cluster: the EKS module applies its module-level
  # tags to both the cluster security group and the node security group, so this
  # selector may match both. Karpenter attaches every security group it matches,
  # which is workable but not what was intended. Check with
  # `aws ec2 describe-security-groups --filters Name=tag:karpenter.sh/discovery,Values=<cluster>`
  # on first apply and narrow the selector to the node group if it returns two.
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ .Values.volumeSizeGi }}Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: ticketing
    ManagedBy: karpenter
