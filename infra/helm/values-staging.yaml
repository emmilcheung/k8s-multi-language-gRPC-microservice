# ── Staging overrides (Issue 46 Phase 3) ─────────────────────────────────────
# Staging validates full NetworkPolicy coverage and external secure Kafka before
# production rollout. Supply KAFKA_* SASL secrets per service.

apollo-router:
  networkPolicy:
    enabled: true

auth-service:
  networkPolicy:
    enabled: true

ticket-service:
  networkPolicy:
    enabled: true

order-service:
  networkPolicy:
    enabled: true

payment-service:
  networkPolicy:
    enabled: true

expiration-service:
  networkPolicy:
    enabled: true

attendance-service:
  networkPolicy:
    enabled: true

client:
  networkPolicy:
    enabled: true

venue-service:
  networkPolicy:
    enabled: true

user-service:
  networkPolicy:
    enabled: true

kafka:
  enabled: false

cp-kafka:
  enabled: false

# ── Managed datastores ────────────────────────────────────────────────────────
# Staging and prod use managed Postgres / Redis / MongoDB. The in-cluster
# subcharts are for local development only and must stay off here; services read
# their connection strings from Kubernetes Secrets via secretRef, not from these
# values.
postgres-auth:
  enabled: false

postgres-orders:
  enabled: false

postgres-payments:
  enabled: false

postgres-users:
  enabled: false

postgres-venue:
  enabled: false

postgres-attendance:
  enabled: false

mongodb:
  enabled: false

redis:
  enabled: false
