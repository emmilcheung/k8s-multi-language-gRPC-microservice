# ── expiration-service ────────────────────────────────────────────────────────
expiration-service:
  # 2+ replicas: asynq workers dedupe on TaskID(orderID), and a single replica with PDB minAvailable=1 can never be evicted (SR-08). Local pins 1 in values-local.yaml.
  replicaCount: 2
  image:
    repository: expiration-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
  env:
    APP_ENV: production
    PORT: "8083"
    LOG_LEVEL: info
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── apollo-router (GraphQL Federation gateway) ────────────────────────────────
apollo-router:
  replicaCount: 2
  image:
    # Apollo Router is published to GHCR — not built from this repo's source.
    # The repository field is the full image path; global.imageRegistry is NOT prepended.
    repository: ghcr.io/apollographql/router
    tag: "v2.1.1"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── client (Next.js) ──────────────────────────────────────────────────────────
client:
  replicaCount: 2
  image:
    repository: client
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
  # Restrict ingress to Kong: client pages decode the JWT without signature
  # verification on the assumption that all traffic enters via Kong (which
  # validates it). The NetworkPolicy enforces that assumption at the network
  # layer. Explicitly disabled in values-local.yaml (minikube).
  networkPolicy:
    enabled: true
  env:
    NODE_ENV: production
    PORT: "4000"
    # Browser-facing: Kong proxy reachable from the end-user's browser
    NEXT_PUBLIC_API_URL: "http://kong-proxy"
    # Server-side: Next.js Server Actions / Server Components call Kong via
    # the in-cluster ClusterIP DNS name — never via the public LoadBalancer.
    # This is the same Kong proxy; the difference is the network path taken.
    INTERNAL_API_URL: "http://ticketing-kong-proxy.ticketing.svc.cluster.local:8000"
    # Server-side GraphQL: Next.js Server Components reach Kong for JWT validation
    # via the in-cluster ClusterIP DNS name (routes through Kong for auth).
    GRAPHQL_API_URL: "http://ticketing-kong-proxy.ticketing.svc.cluster.local:8000/graphql"
    # Browser-facing GraphQL: routed through Kong so the browser uses one origin.
    # Override per-env via --set client.env.NEXT_PUBLIC_GRAPHQL_API_URL=<url>.
    NEXT_PUBLIC_GRAPHQL_API_URL: "http://kong-proxy/graphql"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

