# ── postgres-auth (Bitnami PostgreSQL) ────────────────────────────────────────
postgres-auth:
  auth:
    database: auth_db
    username: auth_user
    existingSecret: postgres-auth-secret
    secretKeys:
      userPasswordKey: password
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  metrics:
    enabled: true

