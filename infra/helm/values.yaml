      memory: 512Mi
  metrics:
    enabled: true

# ── redis (Bitnami Redis) ─────────────────────────────────────────────────────
redis:
  auth:
    enabled: false
  architecture: standalone
  master:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  metrics:
    enabled: true

# ── kafka (Bitnami Kafka — KRaft mode) ────────────────────────────────────────
# Non-production default only. Staging and production must disable this chart
# via values-staging.yaml / values-prod.yaml and use externally managed Kafka
# with per-service SASL credentials in Secrets.
kafka:
  kraft:
    enabled: true
  controller:
    replicaCount: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  broker:
    replicaCount: 1
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
  metrics:
    kafka:
      enabled: true
    jmx:
      enabled: true

# ── Kong API Gateway ──────────────────────────────────────────────────────────
kong:
  env:
    database: "off"
    proxy_access_log: /dev/stdout
    admin_access_log: /dev/stdout
    proxy_error_log: /dev/stderr
    admin_error_log: /dev/stderr
    log_level: info
  ingressController:
    enabled: false
  proxy:
    type: LoadBalancer
  admin:
    enabled: true
    type: ClusterIP
  dblessConfig:
    # Kong config is rendered by services/kong-gateway/scripts/build.sh and
    # passed to helm via --set-file kong.dblessConfig.config=<rendered-kong.yml>
    # in infra/local/setup.sh (minikube) or in the CI/CD pipeline (EKS).
    # Do not set configMap here — the rendered config is passed inline.
    configMap: ""
