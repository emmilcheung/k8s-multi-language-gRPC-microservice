# ── Global defaults ───────────────────────────────────────────────────────────
# Overridden per-environment in values-local.yaml (minikube) and values-prod.yaml (EKS).

global:
  # Image registry prefix — set to minikube's local registry or GHCR
  imageRegistry: "ghcr.io/your-org"
  # Image pull policy: Always in production, IfNotPresent in local
  imagePullPolicy: IfNotPresent
  # Namespace all resources land in
  namespace: ticketing
  serviceMesh:
    enabled: true
    provider: linkerd
    linkerd:
      skipOutboundPorts: "9092"
      grpcServerPolicy:
        enabled: true
      identityDomain: cluster.local

# ── auth-service ──────────────────────────────────────────────────────────────
auth-service:
  replicaCount: 2
  image:
    repository: auth-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
    PORT: "3000"
  # Secrets are injected from Kubernetes Secrets — never hardcoded here
  secretRef: auth-service-secrets
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── ticket-service ────────────────────────────────────────────────────────────
ticket-service:
  replicaCount: 2
  image:
    repository: ticket-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
    grpcPort: 50051
  env:
    APP_ENV: production
    PORT: "3001"
    GRPC_PORT: "50051"
    LOG_LEVEL: info
    REDIS_URL: ""
    VENUE_SERVICE_ADDR: "venue-service:50052"
    # When opensearch.enabled=true, set these via overlay or --set at deploy time:
    #   SEARCH_BACKEND: opensearch
    #   OPENSEARCH_URL: "http://ticketing-opensearch:9200"
    #   OPENSEARCH_INDEX: tickets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── opensearch ────────────────────────────────────────────────────────────────
# Disabled by default — enable only in staging/prod overlays or via --set.
# See Chart.yaml: condition: opensearch.enabled.
opensearch:
  enabled: false

# ── order-service ─────────────────────────────────────────────────────────────
order-service:
  replicaCount: 2
  image:
    repository: order-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
  env:
    SPRING_ENVIRONMENT: production
    SERVER_PORT: "8082"
    SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    SPRING_JPA_SHOW_SQL: "false"
    REDIS_URL: ""
    TICKET_SERVICE_GRPC_HOST: ticket-service
    TICKET_SERVICE_GRPC_PORT: "50051"
    VENUE_SERVICE_GRPC_HOST: venue-service
    VENUE_SERVICE_GRPC_PORT: "50052"
    TICKET_SERVICE_GRPC_DEADLINE_MS: "5000"
    # Spring Boot 4 OTel — HTTP/protobuf exporter (port 4318, not gRPC port 4317).
    # Set to your collector's HTTP/protobuf receiver; overridden at deploy time via
    # --set order-service.env.OTEL_EXPORTER_OTLP_ENDPOINT=<url>.
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_LOGS_EXPORTER: none
    OTEL_SERVICE_NAME: order-service
  secretRef: order-service-secrets
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ── payment-service ───────────────────────────────────────────────────────────
payment-service:
  replicaCount: 2
  image:
    repository: payment-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
  env:
    NODE_ENV: production
    PORT: "3002"
    ORDER_SERVICE_URL: "http://order-service:8082"
  secretRef: payment-service-secrets
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── expiration-service ────────────────────────────────────────────────────────
expiration-service:
  replicaCount: 1
  image:
    repository: expiration-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
  env:
    APP_ENV: production
    PORT: "8083"
    LOG_LEVEL: info
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── apollo-router (GraphQL Federation gateway) ────────────────────────────────
apollo-router:
  replicaCount: 2
  image:
    # Apollo Router is published to GHCR — not built from this repo's source.
    # The repository field is the full image path; global.imageRegistry is NOT prepended.
    repository: ghcr.io/apollographql/router
    tag: "v2.1.1"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── client (Next.js) ──────────────────────────────────────────────────────────
client:
  replicaCount: 2
  image:
    repository: client
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
  # Restrict ingress to Kong: client pages decode the JWT without signature
  # verification on the assumption that all traffic enters via Kong (which
  # validates it). The NetworkPolicy enforces that assumption at the network
  # layer. Explicitly disabled in values-local.yaml (minikube).
  networkPolicy:
    enabled: true
  env:
    NODE_ENV: production
    PORT: "4000"
    # Browser-facing: Kong proxy reachable from the end-user's browser
    NEXT_PUBLIC_API_URL: "http://kong-proxy"
    # Server-side: Next.js Server Actions / Server Components call Kong via
    # the in-cluster ClusterIP DNS name — never via the public LoadBalancer.
    # This is the same Kong proxy; the difference is the network path taken.
    INTERNAL_API_URL: "http://ticketing-kong-proxy.ticketing.svc.cluster.local:8000"
    # Server-side GraphQL: Next.js Server Components reach Kong for JWT validation
    # via the in-cluster ClusterIP DNS name (routes through Kong for auth).
    GRAPHQL_API_URL: "http://ticketing-kong-proxy.ticketing.svc.cluster.local:8000/graphql"
    # Browser-facing GraphQL: routed through Kong so the browser uses one origin.
    # Override per-env via --set client.env.NEXT_PUBLIC_GRAPHQL_API_URL=<url>.
    NEXT_PUBLIC_GRAPHQL_API_URL: "http://kong-proxy/graphql"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── venue-service ─────────────────────────────────────────────────────────────
venue-service:
  replicaCount: 2
  image:
    repository: venue-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
    grpcPort: 50052
