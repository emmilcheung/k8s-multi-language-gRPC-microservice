# ── Global defaults ───────────────────────────────────────────────────────────
# Overridden per-environment in values-local.yaml (minikube) and values-prod.yaml (EKS).

global:
  # Image registry prefix — set to minikube's local registry or GHCR
  imageRegistry: "ghcr.io/your-org"
  # Image pull policy: Always in production, IfNotPresent in local
  imagePullPolicy: IfNotPresent
  # Namespace all resources land in
  namespace: ticketing
  serviceMesh:
    enabled: true
    provider: linkerd
    linkerd:
      # The in-cluster cp-kafka PLAINTEXT listener. Every overlay whose Kafka is
      # not that broker must override this — values-staging.yaml and
      # values-prod.yaml set 9098 for MSK's SASL/IAM listener. A default that is
      # only right locally is fine; a default silently inherited by a managed
      # broker on a different port is not, which is what used to happen here.
      skipOutboundPorts: "9092"
      grpcServerPolicy:
        enabled: true
      identityDomain: cluster.local
  # External Secrets Operator. When enabled, each service chart renders an
  # ExternalSecret that populates the Secret named by its `secretRef` from the
  # store below, replacing the out-of-band `kubectl create secret` step.
  #
  # Off by default, and it must stay off until two things exist that this chart
  # deliberately does not create: the operator itself (a cluster-wide install)
  # and an IRSA role letting it read Secrets Manager (Terraform). Rendering an
  # ExternalSecret against a store that does not exist leaves the Secret absent
  # and every pod stuck in CreateContainerConfigError, which is a worse failure
  # than the manual step it replaces.
  #
  # A chart may override this for itself with `<chart>.externalSecrets.enabled`;
  # a chart-level value wins over this one either way, including `false`.
  externalSecrets:
    enabled: false
    # Name and kind of the SecretStore/ClusterSecretStore to read from.
    secretStore:
      name: ""
      kind: ClusterSecretStore
    # Remote secrets are looked up at `<prefix>/<chart name>`, e.g.
    # ticketing-prod/auth-service. Defaults to the release namespace, which is
    # what keeps staging and prod from reading each other's credentials.
    remoteKeyPrefix: ""
    refreshInterval: 1h

# ── auth-service ──────────────────────────────────────────────────────────────
auth-service:
  replicaCount: 2
  image:
    repository: auth-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
    PORT: "3000"
  # Secrets are injected from Kubernetes Secrets — never hardcoded here
  secretRef: auth-service-secrets
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── ticket-service ────────────────────────────────────────────────────────────
ticket-service:
  replicaCount: 2
  image:
    repository: ticket-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
    grpcPort: 50051
  env:
    APP_ENV: production
    PORT: "3001"
    GRPC_PORT: "50051"
    LOG_LEVEL: info
    REDIS_URL: ""
    VENUE_SERVICE_ADDR: "venue-service:50052"
    # When opensearch.enabled=true, set these via overlay or --set at deploy time:
    #   SEARCH_BACKEND: opensearch
    #   OPENSEARCH_URL: "http://ticketing-opensearch:9200"
    #   OPENSEARCH_INDEX: tickets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── opensearch ────────────────────────────────────────────────────────────────
# Disabled by default — enable only in staging/prod overlays or via --set.
# See Chart.yaml: condition: opensearch.enabled.
opensearch:
  enabled: false

# ── order-service ─────────────────────────────────────────────────────────────
order-service:
  replicaCount: 2
  image:
    repository: order-service
    tag: "SET_BY_CI"  # overridden to git SHA at deploy time; never use latest in any env (I-04)
  env:
    SPRING_ENVIRONMENT: production
    SERVER_PORT: "8082"
    SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    SPRING_JPA_SHOW_SQL: "false"
    REDIS_URL: ""
    TICKET_SERVICE_GRPC_HOST: ticket-service
    TICKET_SERVICE_GRPC_PORT: "50051"
    VENUE_SERVICE_GRPC_HOST: venue-service
    VENUE_SERVICE_GRPC_PORT: "50052"
    TICKET_SERVICE_GRPC_DEADLINE_MS: "5000"
    # Spring Boot 4 OTel — HTTP/protobuf exporter (port 4318, not gRPC port 4317).
    # Set to your collector's HTTP/protobuf receiver; overridden at deploy time via
    # --set order-service.env.OTEL_EXPORTER_OTLP_ENDPOINT=<url>.
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_LOGS_EXPORTER: none
    OTEL_SERVICE_NAME: order-service
  secretRef: order-service-secrets
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

