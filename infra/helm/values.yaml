    PORT: "3003"
    GRPC_PORT: "50052"
    LOG_LEVEL: info
  secretRef: venue-service-secrets  # contains DATABASE_URL, REDIS_URL, KAFKA_BROKERS
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
