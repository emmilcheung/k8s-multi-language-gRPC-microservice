{{- /*
Populates the Secret named by .Values.secretRef from an external secret store
instead of provisioning it out-of-band. The target name is deliberately
.Values.secretRef and not the chart fullname: deployment.yaml consumes that
Secret via `envFrom.secretRef`, so the two must agree, and keeping the name
unchanged means switching a cluster to External Secrets needs no other edit.

`dataFrom.extract` copies every key of the remote secret rather than listing
them here. The remote value is a JSON object whose keys become the Secret's
keys, which is the right shape for an envFrom consumer: the service's env
contract can change without this template drifting behind it.

Requires the External Secrets Operator CRDs and a SecretStore/ClusterSecretStore
to already exist in the cluster — neither is installed by this chart (an
operator install is cluster-wide, and the IRSA role that lets it read Secrets
Manager is Terraform). Leave disabled until both are in place; the out-of-band
Secret remains the default everywhere.

Not handled here: rotating the remote value updates the Secret but does not
restart the pods, because envFrom is resolved only at container start. A
reloader or a rollout is needed for rotation to take effect.
*/}}
{{- $es := .Values.externalSecrets | default dict -}}
{{- $g := (.Values.global | default dict).externalSecrets | default dict -}}
{{- $enabled := $g.enabled | default false -}}
{{- if hasKey $es "enabled" }}{{- $enabled = $es.enabled -}}{{- end }}
{{- if $enabled }}
{{- $store := $es.secretStore | default $g.secretStore | default dict -}}
{{- $storeName := $store.name | default "" -}}
{{- if not $storeName }}
{{- fail "externalSecrets is enabled but no secret store is named: set global.externalSecrets.secretStore.name" }}
{{- end }}
{{- if not .Values.secretRef }}
{{- fail "externalSecrets is enabled but secretRef is empty: there is no Secret name to write into" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "user-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default $g.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ $store.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.secretRef }}
    # Owner, so deleting the ExternalSecret deletes the Secret it created and a
    # disabled environment cannot inherit a stale one.
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $es.remoteKey | default (printf "%s/%s" ($g.remoteKeyPrefix | default .Release.Namespace) .Chart.Name) | quote }}
{{- end }}
