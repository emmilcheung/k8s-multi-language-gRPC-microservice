replicaCount: 2

image:
  repository: venue-service
  tag: SET_BY_CI
  pullPolicy: IfNotPresent

service:
  httpPort: 3003
  grpcPort: 50052

env:
  APP_ENV: production
  PORT: "3003"
  GRPC_PORT: "50052"
  LOG_LEVEL: info
  # pgx pool ceiling per pod. The database sees this times the pod
  # count, so read it with autoscaling.maxReplicas below; the fleet-wide
  # budget is in docs/05-data-conventions.md.
  DB_POOL_MAX: "10"

secretRef: venue-service-secrets  # contains DATABASE_URL, REDIS_URL, KAFKA_BROKERS, optional KAFKA_SECURITY_PROTOCOL/KAFKA_SASL_MECHANISM/KAFKA_SASL_USERNAME/KAFKA_SASL_PASSWORD/KAFKA_SSL_CA_LOCATION, X_USER_ID_SIGNING_KEY

# External Secrets (off unless global.externalSecrets.enabled is true). Uncomment
# to override the global switch for this chart alone — the key being present is
# what makes it win, so `enabled: false` here pins the out-of-band Secret even in
# an environment that has the operator.
# externalSecrets:
#   enabled: true
#   remoteKey: ticketing-prod/venue-service   # default is <namespace>/<chart name>


resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Every scale-in ends the SSE streams the removed pod holds, and
  # those clients reconnect onto the pods that are left. The k8s defaults would
  # remove up to 100% of the fleet in one step after a 300 s window, which on a
  # seat-availability stream is a visible outage rather than a resize. This
  # doubles the window and takes one pod at a time so the reconnects arrive in
  # batches the remaining pods can absorb. scaleUp is left at the k8s default —
  # scaling out costs nobody their stream.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# startupProbe: 60 s budget (12 × 5 s) for Go binary startup + PostgreSQL ping.
startupProbe:
  httpGet:
    path: /healthz/live
    port: http
  failureThreshold: 12
  periodSeconds: 5
  timeoutSeconds: 5

terminationGracePeriodSeconds: 30

# Seconds to keep serving after the pod is condemned, before the
# process is signalled. Set to 0 to drop the hook entirely. See the comment on
# the lifecycle block in templates/deployment.yaml for why this exists; it must
# stay well under terminationGracePeriodSeconds above, which it shares.
lifecycle:
  preStopSleepSeconds: 5

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podAntiAffinity:
  enabled: true

topologySpreadConstraints:
  # Enable in production (multi-AZ EKS) to spread pods across availability zones.
  # Requires nodes labelled with topology.kubernetes.io/zone (standard on EKS).
  # Disabled by default (not applicable in single-node minikube).
  enabled: false

networkPolicy:
  # Enable in staging/production to restrict pod-to-pod communication.
  # Disabled by default to avoid breaking local (minikube) environments.
  enabled: false
