{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for venue-service
# Ingress: Kong (HTTP:3003) + order-service (gRPC:50052)
#          + queue-service (HTTP:3003) when networkPolicy.queueSystem.enabled
# Egress:  PostgreSQL (5432), Redis (6379), Kafka (9092), DNS (53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "venue-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "venue-service.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "venue-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Kong proxy pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpPort }}
    # Allow gRPC from order-service
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: {{ .Values.service.grpcPort }}
    {{- if .Values.networkPolicy.queueSystem.enabled }}
    # Allow HTTP from the waiting room's queue-service pods, only for
    # GET /internal/tickets/:id/availability (its paused / sold-out signal).
    # Same-entry namespaceSelector + podSelector means: that namespace AND those pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.queueSystem.namespace | quote }}
          podSelector:
            matchLabels:
              app: queue-service
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpPort }}
    {{- end }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL (venue DB)
    - ports:
        - protocol: TCP
          port: 5432
    # Redis
    - ports:
        - protocol: TCP
          port: 6379
    # Kafka
    - ports:
        - protocol: TCP
          port: 9092
{{- end }}
