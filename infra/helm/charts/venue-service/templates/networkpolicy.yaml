{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for venue-service
# Ingress: Kong (HTTP:3003) + order-service (gRPC:50052)
# Egress:  PostgreSQL (5432), Redis (6379), Kafka (9092), DNS (53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "venue-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "venue-service.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "venue-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Kong proxy pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpPort }}
    # Allow gRPC from order-service
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: {{ .Values.service.grpcPort }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL (venue DB)
    - ports:
        - protocol: TCP
          port: 5432
    # Redis
    - ports:
        - protocol: TCP
          port: 6379
    # Kafka
    - ports:
        - protocol: TCP
          port: 9092
{{- end }}
