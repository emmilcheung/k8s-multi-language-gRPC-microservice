{{- if and .Values.global.serviceMesh.enabled (eq .Values.global.serviceMesh.provider "linkerd") (.Capabilities.APIVersions.Has "policy.linkerd.io/v1beta1/Server") (.Capabilities.APIVersions.Has "policy.linkerd.io/v1beta1/ServerAuthorization") }}
apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata:
  name: {{ include "mcp-service.fullname" . }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-service.selectorLabels" . | nindent 6 }}
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta1
kind: ServerAuthorization
metadata:
  name: {{ include "mcp-service.fullname" . }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-service.labels" . | nindent 4 }}
spec:
  server:
    name: {{ include "mcp-service.fullname" . }}-http
  client:
    meshTLS:
      identities:
        - {{ printf "ticketing-kong.%s.serviceaccount.identity.linkerd.%s" .Release.Namespace .Values.global.serviceMesh.linkerd.identityDomain | quote }}
{{- end }}
