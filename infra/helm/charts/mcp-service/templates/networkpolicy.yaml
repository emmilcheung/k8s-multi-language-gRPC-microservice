{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for mcp-service (hard stop #10 — owner review required before merge to main)
# Ingress: only from Kong proxy pods.
# Egress:  DNS (53), Kong proxy, auth-service (JWKS + token exchange), OTel collector.
# No other egress: the service holds no datastore and calls no third party.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-service.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kong proxy (REST API calls made with exchanged tokens)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.kongPort }}
    # auth-service (JWKS fetch, RFC 8693 token exchange)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.authServicePort }}
    # OTel collector (OTLP gRPC traces)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.otelCollectorPort }}
{{- end }}
