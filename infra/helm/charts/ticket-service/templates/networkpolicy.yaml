{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for ticket-service (I-01)
# Ingress: Kong (HTTP:3001) + order-service (gRPC:50051)
# Egress:  MongoDB (27017), Kafka (9092), DNS (53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ticket-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket-service.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ticket-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Kong proxy pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpPort }}
    # Allow gRPC from order-service
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: {{ .Values.service.grpcPort }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # MongoDB
    - ports:
        - protocol: TCP
          port: 27017
    # Kafka
    - ports:
        - protocol: TCP
          port: 9092
{{- end }}
