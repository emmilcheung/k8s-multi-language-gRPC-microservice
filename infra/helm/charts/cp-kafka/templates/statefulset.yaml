{{/*
  cp-kafka StatefulSet — single-node KRaft broker+controller.
  Mirrors the docker-compose kafka service exactly.
  When external.enabled=true, adds an EXTERNAL listener advertised on
  <advertisedHost>:9093. In minikube, this is exposed on localhost:9093 via
  `minikube tunnel` and the LoadBalancer service.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cp-kafka.fullname" . }}
  labels:
    {{- include "cp-kafka.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cp-kafka.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "cp-kafka.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cp-kafka.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.external.enabled }}
        # Tell Linkerd to skip mTLS on the EXTERNAL port so plain Kafka clients
        # (e.g. host-side E2E tests via minikube tunnel) can connect without TLS.
        config.linkerd.io/skip-inbound-ports: "9093"
        config.linkerd.io/skip-outbound-ports: "9093"
        {{- end }}
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            {{- if .Values.external.enabled }}
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:{{ .Values.internalPort }},EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:{{ .Values.controllerPort }}"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://{{ include "cp-kafka.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.internalPort }},EXTERNAL://{{ .Values.external.advertisedHost }}:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            {{- else }}
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:{{ .Values.internalPort }},CONTROLLER://0.0.0.0:{{ .Values.controllerPort }}"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://{{ include "cp-kafka.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.internalPort }}"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            {{- end }}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@{{ include "cp-kafka.fullname" . }}-0.{{ include "cp-kafka.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controllerPort }}"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "10485760"
          ports:
            - name: internal
              containerPort: {{ .Values.internalPort }}
            {{- if .Values.external.enabled }}
            - name: external
              containerPort: 9093
            {{- end }}
            - name: controller
              containerPort: {{ .Values.controllerPort }}
          livenessProbe:
            exec:
              command:
                - kafka-broker-api-versions
                - --bootstrap-server
                - "localhost:{{ .Values.internalPort }}"
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - kafka-broker-api-versions
                - --bootstrap-server
                - "localhost:{{ .Values.internalPort }}"
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
