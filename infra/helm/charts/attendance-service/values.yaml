replicaCount: 2

image:
  repository: attendance-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 3007

env:
  APP_ENV: production
  HTTP_PORT: "3007"
  LOG_LEVEL: info
  TICKET_SERVICE_URL: "ticket-service:50051"

secretRef: attendance-service-secrets  # contains DATABASE_URL, KAFKA_BROKERS, QR_SIGNING_KEY, TICKET_SERVICE_URL, X_USER_ID_SIGNING_KEY

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/live
    port: http
  failureThreshold: 12
  periodSeconds: 5
  timeoutSeconds: 5

terminationGracePeriodSeconds: 30

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAntiAffinity:
  enabled: true

topologySpreadConstraints:
  enabled: false

networkPolicy:
  enabled: false
