{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for payment-service (I-01)
# Ingress: Kong (HTTP:3002)
# Egress:  Kafka (9092), PostgreSQL (5432), Redis (6379), order-service (8082),
#          Stripe API (HTTPS:443), DNS (53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "payment-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-service.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "payment-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Kong proxy pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kafka
    - ports:
        - protocol: TCP
          port: 9092
    # PostgreSQL
    - ports:
        - protocol: TCP
          port: 5432
    # Redis
    - ports:
        - protocol: TCP
          port: 6379
    # order-service (HTTP)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: 8082
    # Stripe API and other external HTTPS
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
