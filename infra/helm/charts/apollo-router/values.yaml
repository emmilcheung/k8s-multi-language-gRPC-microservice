# Global defaults — overridden by the umbrella chart when rendered together.
# These safe defaults allow standalone `helm lint` to succeed.
global:
  serviceMesh:
    enabled: false
    provider: linkerd
    linkerd:
      identityDomain: cluster.local

replicaCount: 2

image:
  # Apollo Router is published to GHCR — never pulled from global.imageRegistry.
  # The repository field holds the full image path (no registry prefix prepended).
  repository: ghcr.io/apollographql/router
  tag: "v2.1.1"
  pullPolicy: IfNotPresent

service:
  port: 4001

# Port of the router's separate health listener (health_check.listen in
# files/router.yaml). Probes must target this, not the GraphQL port.
healthCheck:
  port: 8088

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Apollo Router /health endpoint returns 200 when ready.
livenessProbe:
  httpGet:
    path: /health
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: health
  failureThreshold: 12
  periodSeconds: 5
  timeoutSeconds: 5

terminationGracePeriodSeconds: 30

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAntiAffinity:
  enabled: true

topologySpreadConstraints:
  # Enable in production (multi-AZ EKS) to spread pods across availability zones.
  # Requires nodes labelled with topology.kubernetes.io/zone (standard on EKS).
  # Disabled by default (not applicable in single-node minikube).
  enabled: false

networkPolicy:
  enabled: true

# Operation limits are GraphOS-licensed features. Apollo Router v2 does not
# degrade gracefully: if any of these keys is present in router.yaml without a
# valid APOLLO_KEY/APOLLO_GRAPH_REF it logs "license violation" and exits, so
# the pod CrashLoopBackOffs. Keep this enabled wherever a GraphOS license is
# available — it is a real protection against deep/wide hostile queries — and
# disable it only in unlicensed environments such as local minikube.
operationLimits:
  enabled: true
  maxDepth: 15
  maxHeight: 200
  maxAliases: 30
  maxRootFields: 20

telemetry:
  otlpEndpoint: "http://otel-collector:4317"
