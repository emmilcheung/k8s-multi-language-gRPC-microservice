# Global defaults — overridden by the umbrella chart when rendered together.
# These safe defaults allow standalone `helm lint` to succeed.
global:
  serviceMesh:
    enabled: false
    provider: linkerd
    linkerd:
      identityDomain: cluster.local

replicaCount: 2

image:
  # Apollo Router is published to GHCR — never pulled from global.imageRegistry.
  # The repository field holds the full image path (no registry prefix prepended).
  repository: ghcr.io/apollographql/router
  tag: "v2.1.1"
  pullPolicy: IfNotPresent

service:
  port: 4001

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Apollo Router /health endpoint returns 200 when ready.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 12
  periodSeconds: 5
  timeoutSeconds: 5

terminationGracePeriodSeconds: 30

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAntiAffinity:
  enabled: true

topologySpreadConstraints:
  # Enable in production (multi-AZ EKS) to spread pods across availability zones.
  # Requires nodes labelled with topology.kubernetes.io/zone (standard on EKS).
  # Disabled by default (not applicable in single-node minikube).
  enabled: false

networkPolicy:
  # Enable in staging/production to restrict pod-to-pod communication.
  # Disabled by default to avoid breaking local (minikube) environments.
  enabled: false

telemetry:
  otlpEndpoint: "http://otel-collector:4317"
