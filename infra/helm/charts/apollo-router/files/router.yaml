supergraph:
  listen: 0.0.0.0:4001
  path: /graphql
  introspection: false

headers:
  all:
    request:
      - propagate:
          named: x-user-id
      - propagate:
          named: x-user-roles
      - propagate:
          named: x-user-id-sig
      - propagate:
          named: traceparent
      - propagate:
          named: tracestate
  subgraphs:
    auth:
      request:
        - propagate:
            named: cookie

