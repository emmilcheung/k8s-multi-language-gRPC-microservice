apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apollo-router.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apollo-router.labels" . | nindent 4 }}
data:
  router.yaml: |
    {{- .Files.Get "files/router.yaml" | nindent 4 }}
    {{- if .Values.operationLimits.enabled }}
    limits:
      max_depth: {{ .Values.operationLimits.maxDepth }}
      max_height: {{ .Values.operationLimits.maxHeight }}
      max_aliases: {{ .Values.operationLimits.maxAliases }}
      max_root_fields: {{ .Values.operationLimits.maxRootFields }}
    {{- end }}
  supergraph.graphql: |
    {{- .Files.Get "files/supergraph.graphql" | nindent 4 }}
