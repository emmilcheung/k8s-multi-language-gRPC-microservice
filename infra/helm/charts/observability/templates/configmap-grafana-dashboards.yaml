apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-grafana-dashboards
  labels:
    app.kubernetes.io/name: {{ include "observability.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
data:
  dashboards.yml: |-
{{ .Files.Get "grafana/provisioning/dashboards/dashboards.yml" | indent 4 }}
{{- range $path, $file := .Files.Glob "grafana/dashboards/*" }}
  {{ base $path }}: |-
{{ printf "%s" $file | indent 4 }}
{{- end }}
