# Global defaults — overridden by the umbrella chart when rendered together.
# These safe defaults allow standalone `helm lint` to succeed.
global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent

replicaCount: 2

image:
  repository: client
  tag: SET_BY_CI
  pullPolicy: IfNotPresent

service:
  port: 4000

env:
  NODE_ENV: production
  PORT: "4000"
  NEXT_PUBLIC_API_URL: "http://kong-proxy"
  # Server-side GraphQL: Next.js Server Components / Actions reach the router
  # via the in-cluster ClusterIP DNS name — never via the public LoadBalancer.
  GRAPHQL_API_URL: "http://apollo-router:4001/graphql"
  # Browser-facing GraphQL: routed through Kong so the browser uses one origin.
  # Override per-env: dev/staging/prod set this to the public Kong hostname.
  NEXT_PUBLIC_GRAPHQL_API_URL: "http://kong-proxy/graphql"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# startupProbe: 60 s budget for Next.js server startup + ISR warm-up.
startupProbe:
  httpGet:
    path: /api/health
    port: http
  failureThreshold: 12
  periodSeconds: 5
  timeoutSeconds: 5

terminationGracePeriodSeconds: 30

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAntiAffinity:
  enabled: true

topologySpreadConstraints:
  # Enable in production (multi-AZ EKS) to spread pods across availability zones.
  # Requires nodes labelled with topology.kubernetes.io/zone (standard on EKS).
  # Disabled by default (not applicable in single-node minikube).
  enabled: false

networkPolicy:
  # Enable in staging/production to restrict pod-to-pod communication.
  # Disabled by default to avoid breaking local (minikube) environments.
  enabled: false
