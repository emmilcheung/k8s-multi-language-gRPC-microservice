replicaCount: 2

image:
  repository: client
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 4000

env:
  NODE_ENV: production
  PORT: "4000"
  NEXT_PUBLIC_API_URL: "http://kong-proxy"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

terminationGracePeriodSeconds: 30

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAntiAffinity:
  enabled: true
