apiVersion: v1
kind: Service
metadata:
  name: {{ include "client.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "client.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "client.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
