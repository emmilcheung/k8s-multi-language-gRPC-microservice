{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for client (Next.js) (I-01)
# Ingress: Kong (HTTP:4000)
# Egress:  Kong (internal API calls for SSR), DNS (53), HTTPS for external assets
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "client.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "client.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "client.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Kong proxy pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kong (for Next.js SSR internal API calls via INTERNAL_API_URL)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: 8000
    # External HTTPS (fonts, CDN assets, etc.)
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
