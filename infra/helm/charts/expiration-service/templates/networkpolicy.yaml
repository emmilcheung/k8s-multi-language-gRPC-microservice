{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for expiration-service (I-01)
# Ingress: health/metrics scraping from within cluster only (no Kong ingress)
# Egress:  Redis (6379), Kafka (9092), DNS (53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "expiration-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expiration-service.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "expiration-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow health/metrics scraping from within the namespace
    # (e.g. Prometheus, Kubernetes liveness/readiness probes via kubelet)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Redis
    - ports:
        - protocol: TCP
          port: 6379
    # Kafka
    - ports:
        - protocol: TCP
          port: 9092
{{- end }}
