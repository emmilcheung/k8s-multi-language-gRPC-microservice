replicaCount: 1

image:
  repository: expiration-service
  tag: SET_BY_CI
  pullPolicy: IfNotPresent

service:
  port: 8083

env:
  APP_ENV: production
  PORT: "8083"
  LOG_LEVEL: info

secretRef: expiration-service-secrets  # contains REDIS_ADDR, KAFKA_BROKERS, optional KAFKA_SECURITY_PROTOCOL/KAFKA_SASL_MECHANISM/KAFKA_SASL_USERNAME/KAFKA_SASL_PASSWORD/KAFKA_SSL_CA_LOCATION

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# startupProbe: 30 s budget for Go binary + Redis/Kafka connectivity.
startupProbe:
  httpGet:
    path: /healthz/live
    port: http
  failureThreshold: 6
  periodSeconds: 5
  timeoutSeconds: 5

terminationGracePeriodSeconds: 30

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAntiAffinity:
  enabled: false

topologySpreadConstraints:
  # Enable in production (multi-AZ EKS) to spread pods across availability zones.
  # Requires nodes labelled with topology.kubernetes.io/zone (standard on EKS).
  # Disabled by default (not applicable in single-node minikube).
  enabled: false

networkPolicy:
  # Enable in staging/production to restrict pod-to-pod communication.
  # Disabled by default to avoid breaking local (minikube) environments.
  enabled: false
