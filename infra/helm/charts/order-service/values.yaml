replicaCount: 2

image:
  repository: order-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8082

env:
  SPRING_ENVIRONMENT: production
  SERVER_PORT: "8082"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_SHOW_SQL: "false"
  # Override this per environment in the parent chart's values file.
  # Local minikube: ticketing-ticket-service.ticketing.svc.cluster.local
  # EKS: <release>-ticket-service.<namespace>.svc.cluster.local
  TICKET_SERVICE_GRPC_HOST: ticket-service
  TICKET_SERVICE_GRPC_PORT: "50051"
  TICKET_SERVICE_GRPC_DEADLINE_MS: "5000"

secretRef: order-service-secrets  # contains SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, SPRING_KAFKA_BOOTSTRAP_SERVERS

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

terminationGracePeriodSeconds: 30

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAntiAffinity:
  enabled: true
