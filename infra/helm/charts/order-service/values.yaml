replicaCount: 2

image:
  repository: order-service
  tag: SET_BY_CI
  pullPolicy: IfNotPresent

service:
  port: 8082

env:
  SPRING_ENVIRONMENT: production
  SERVER_PORT: "8082"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_SHOW_SQL: "false"
  # Override this per environment in the parent chart's values file.
  # Local minikube: ticketing-ticket-service.ticketing.svc.cluster.local
  # EKS: <release>-ticket-service.<namespace>.svc.cluster.local
  TICKET_SERVICE_GRPC_HOST: ticket-service
  TICKET_SERVICE_GRPC_PORT: "50051"
  TICKET_SERVICE_GRPC_DEADLINE_MS: "5000"

secretRef: order-service-secrets  # contains SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, KAFKA_BROKERS, optional KAFKA_SECURITY_PROTOCOL/KAFKA_SASL_MECHANISM/KAFKA_SASL_USERNAME/KAFKA_SASL_PASSWORD, X_USER_ID_SIGNING_KEY

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# startupProbe: 150 s budget (30 × 5 s) to allow Spring Boot JVM warmup,
# Flyway migrations, and Kafka consumer initialization before liveness kicks in.
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 5

terminationGracePeriodSeconds: 30

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podAntiAffinity:
  enabled: true

topologySpreadConstraints:
  # Enable in production (multi-AZ EKS) to spread pods across availability zones.
  # Requires nodes labelled with topology.kubernetes.io/zone (standard on EKS).
  # Disabled by default (not applicable in single-node minikube).
  enabled: false

networkPolicy:
  # Enable in staging/production to restrict pod-to-pod communication.
  # Disabled by default to avoid breaking local (minikube) environments.
  enabled: false
