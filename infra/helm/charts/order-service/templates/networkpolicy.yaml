{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for order-service (I-01)
# Ingress: Kong (HTTP:8082)
# Egress:  ticket-service (gRPC:50051), Kafka (9092), PostgreSQL (5432), DNS (53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "order-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "order-service.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "order-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Kong proxy pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # ticket-service gRPC
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ticket-service
      ports:
        - protocol: TCP
          port: 50051
    # Kafka
    - ports:
        - protocol: TCP
          port: 9092
    # PostgreSQL
    - ports:
        - protocol: TCP
          port: 5432
{{- end }}
