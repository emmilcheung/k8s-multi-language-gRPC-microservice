{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "order-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "order-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- /*
    Memory is opt-in here, unlike the other service charts, because this one runs
    a JVM: the heap is reserved up front and released back lazily, so RSS tracks
    what the process has ever needed rather than what it needs now. As a scaling
    signal that is close to a constant — it stays high after load subsides, which
    blocks scale-in, and it rises during GC pressure, which is when adding pods
    helps least. Set targetMemoryUtilizationPercentage only if you have a reason
    the heap sizing does not already cover.
    */}}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
