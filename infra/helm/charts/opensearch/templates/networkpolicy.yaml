{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for opensearch (I-01)
# Ingress: ticket-service pods on 9200 only.
# This policy is the primary authz boundary for this chart per docs/06-security.md:50.
# In-cluster transport security is provided by the Linkerd service mesh.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opensearch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress on 9200 only from ticket-service pods in the release namespace.
    # namespaceSelector + podSelector are ANDed: only ticket-service pods in this
    # namespace can reach OpenSearch (prevents cross-namespace bypass).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ticket-service
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 9200
{{- end }}
