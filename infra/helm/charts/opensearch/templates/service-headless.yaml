apiVersion: v1
kind: Service
metadata:
  name: {{ include "opensearch.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  # clusterIP: None makes this a headless service — required by the StatefulSet
  # controller to form stable pod DNS names. Not intended for client access.
  # Clients (e.g. ticket-service) should use the ClusterIP service (service.yaml).
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP
  selector:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: {{ .Release.Name }}
