mongodb:
  auth:
    existingSecret: ""
    rootUser: mongo_user
    rootPassword: "mongo-local-secret"
    # Clear the deprecated singular fields from values.yaml to prevent duplicate users
    username: ""
    password: ""
    database: ""
    usernames: []
    passwords: []
    databases: []
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  metrics:
    enabled: false

redis:
  auth:
    enabled: false
  master:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  metrics:
    enabled: false

kafka:
  enabled: false   # bitnami/kafka image not on Docker Hub — use cp-kafka instead

# Confluent cp-kafka — single-node KRaft broker matching docker-compose config
cp-kafka:
  enabled: true
  external:
    enabled: true
    nodePort: 30093        # unused for LoadBalancer but kept for schema completeness
    advertisedHost: "127.0.0.1"  # minikube tunnel exposes LoadBalancer on localhost

apollo-router:
  networkPolicy:
    enabled: false

kong:
  # Prefer A records over SRV to avoid CoreDNS NXDOMAIN on ClusterIP services.
  # Without this, Kong 3.x tries SRV (type 33) first; CoreDNS returns NXDOMAIN
  # for ClusterIP services, causing upstream resolution failures.
  env:
    dns_order: "LAST,A,SRV,CNAME"
  proxy:
    # minikube tunnel exposes LoadBalancer on localhost
    # Ports set to 8000/8443 to avoid macOS sudo requirement for ports <1024.
    type: LoadBalancer
    http:
      enabled: true
      servicePort: 8000
      containerPort: 8000
    tls:
      enabled: true
      servicePort: 8443
      containerPort: 8443
