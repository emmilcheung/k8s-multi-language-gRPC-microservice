# values-local.yaml — minikube overrides
#
# Apply with:
#   helm upgrade --install ticketing ./infra/helm \
#     -f infra/helm/values-local.yaml \
#     --namespace ticketing --create-namespace
#
# Prerequisites:
#   minikube start --cpus=4 --memory=8192
#   eval $(minikube docker-env)          # build images into minikube's Docker
#   minikube tunnel &                    # makes LoadBalancer services reachable on localhost
#   helm dependency update ./infra/helm  # fetch all chart dependencies

global:
  # Use images built directly into minikube's Docker daemon
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  namespace: ticketing
  security:
    allowInsecureImages: true
  serviceMesh:
    enabled: true
    provider: linkerd
    linkerd:
      skipOutboundPorts: "9092"
      grpcServerPolicy:
        enabled: true
      identityDomain: cluster.local

# ── Application services — single replica, smaller resources for local dev ───

auth-service:
  replicaCount: 1
  image:
    repository: auth-service
    tag: SET_BY_CI
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_SERVICE_NAME: auth-service
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 512Mi   # argon2 hashing is memory-intensive under concurrent E2E test load
  autoscaling:
    enabled: false

ticket-service:
  replicaCount: 1
  image:
    repository: ticket-service
    tag: SET_BY_CI
  env:
    REDIS_URL: redis://ticketing-redis-master.ticketing.svc.cluster.local:6379
    VENUE_SERVICE_ADDR: ticketing-venue-service.ticketing.svc.cluster.local:50052
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_SERVICE_NAME: ticket-service
    # SEARCH_BACKEND/OPENSEARCH_URL not set locally — ticket-service uses the Mongo path.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi
  autoscaling:
    enabled: false

order-service:
  replicaCount: 1
  image:
    repository: order-service
    tag: SET_BY_CI
  env:
    REDIS_URL: redis://ticketing-redis-master.ticketing.svc.cluster.local:6379
    # Override the default short name with the FQDN for the minikube release.
    # The release name is 'ticketing' and the namespace is 'ticketing'.
    TICKET_SERVICE_GRPC_HOST: ticketing-ticket-service.ticketing.svc.cluster.local
    TICKET_SERVICE_GRPC_PORT: "50051"
    VENUE_SERVICE_GRPC_HOST: ticketing-venue-service.ticketing.svc.cluster.local
    VENUE_SERVICE_GRPC_PORT: "50052"
    # Spring Boot 4's OTel SDK (spring-boot-starter-opentelemetry) uses HTTP/protobuf,
    # not gRPC. Port 4318 is the collector's HTTP/protobuf receiver. All other services
    # use Go/Node SDKs which speak gRPC natively on port 4317.
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4318"
    # Logs are structured JSON shipped via logstash/fluentd — not via OTLP.
    OTEL_LOGS_EXPORTER: none
    OTEL_SERVICE_NAME: order-service
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
  # Spring Boot takes ~60s to start when KafkaAdmin blocks (broker unreachable).
  # Increase initial delays so the probe doesn't fire before the app is up.
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 90
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

payment-service:
  replicaCount: 1
  image:
    repository: payment-service
    tag: SET_BY_CI
  env:
    ORDER_SERVICE_URL: "http://ticketing-order-service:8082"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_SERVICE_NAME: payment-service
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: false

expiration-service:
  replicaCount: 1
  image:
    repository: expiration-service
    tag: SET_BY_CI
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_SERVICE_NAME: expiration-service
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  autoscaling:
    enabled: false

venue-service:
  replicaCount: 1
  image:
    repository: venue-service
    tag: SET_BY_CI
  env:
    REDIS_URL: redis://ticketing-redis-master.ticketing.svc.cluster.local:6379
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_SERVICE_NAME: venue-service
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi
  autoscaling:
    enabled: false

attendance-service:
  replicaCount: 1
  image:
    repository: attendance-service
    tag: SET_BY_CI
  env:
    APP_ENV: development
    HTTP_PORT: "3007"
    LOG_LEVEL: info
    TICKET_SERVICE_URL: "ticketing-ticket-service.ticketing.svc.cluster.local:50051"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4317"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: false

user-service:
  replicaCount: 1
  image:
    repository: user-service
    tag: SET_BY_CI
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_SERVICE_NAME: user-service
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: false

apollo-router:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

client:
  replicaCount: 1
  image:
    repository: client
    tag: SET_BY_CI
  # NetworkPolicy off locally (minikube CNI may not enforce policies; keeps
  # local port-forward/dev access working). Enabled in values.yaml for cloud.
  networkPolicy:
    enabled: false
  env:
    NEXT_PUBLIC_API_URL: "http://localhost:8000"
    INTERNAL_API_URL: "http://ticketing-kong-proxy:8000"
    # Server-side GraphQL: FQDN within minikube's ticketing namespace.
    GRAPHQL_API_URL: "http://ticketing-apollo-router.ticketing.svc.cluster.local:4001/graphql"
    # Browser-facing GraphQL: minikube tunnel exposes Kong on localhost:8000.
    NEXT_PUBLIC_GRAPHQL_API_URL: "http://localhost:8000/graphql"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://ticketing-observability-otel-collector:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_SERVICE_NAME: client
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: false
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

# Disabled locally — protects the 7 GB minikube memory budget.
# Enable with: helm upgrade --install ticketing ./infra/helm -f infra/helm/values-local.yaml --set opensearch.enabled=true
opensearch:
  enabled: false
  # security.disabled=true is the chart default (plugin OFF + NetworkPolicy + mesh mTLS).
  # No override needed here — left explicit for clarity.
  security:
    disabled: true

observability:
  enabled: true
  jaeger:
    service:
      type: LoadBalancer
      uiPort: 16686
      otlpPort: 4317
  prometheus:
    service:
      type: LoadBalancer
      port: 9090
  grafana:
    service:
      type: LoadBalancer
      port: 3000

# ── Backing infrastructure — minimal footprint for minikube ──────────────────

postgres-auth:
  auth:
    existingSecret: ""
    postgresPassword: "auth-local-secret"
    username: "auth_user"
    password: "auth-local-secret"
    database: "auth_db"
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  metrics:
    enabled: false

postgres-orders:
  auth:
    existingSecret: ""
    postgresPassword: "orders-local-secret"
    username: "orders_user"
    password: "orders-local-secret"
    database: "orders_db"
  primary:
