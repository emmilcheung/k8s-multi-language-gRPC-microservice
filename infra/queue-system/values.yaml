image:
  repository: queue-service
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 3   # stateless — admission is pure time-math, safe to scale

queue:
  # REQUIRED: set via --set queue.hmacSecret=... or an external Secret (min 32 chars).
  # Empty by default so a deploy can never ship a known/placeholder signing key;
  # the service refuses to start in Production with the shipped placeholder.
  hmacSecret: ""
  admissionTtlSeconds: 600
  slidingGraceSeconds: 60

redis:
  image: redis:7-alpine

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: queue.example.com

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
