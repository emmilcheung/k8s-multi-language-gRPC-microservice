image:
  repository: queue-service
  # Set per deploy (--set image.tag=<git sha>), like every chart under infra/helm.
  # Never `latest` (repo rule I-04): with IfNotPresent, nodes keep whatever
  # `latest` they cached first, so replicas silently run different builds.
  tag: SET_BY_CI
  pullPolicy: IfNotPresent

# Used only when autoscaling.enabled is false.
replicaCount: 3

queue:
  # REQUIRED: set via --set queue.hmacSecret=... or an external Secret (min 32 chars).
  # Empty by default so a deploy can never ship a known/placeholder signing key;
  # the service refuses to start in Production with the shipped placeholder.
  hmacSecret: ""
  admissionTtlSeconds: 600
  slidingGraceSeconds: 60

# Stateless app — admission is pure time-math, safe to scale horizontally.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

# Keep capacity during voluntary disruptions (node drain, rollout).
pdb:
  enabled: true
  minAvailable: 2

redis:
  # Exact version, not a floating `7-alpine`: this pod holds queue state, and a
  # floating tag lets a reschedule onto a fresh node quietly change the Redis
  # version underneath the AOF file the old one wrote.
  image: redis:7.4.2-alpine
  # AOF persistence so a restart recovers queue state (avoids fail-open where an
  # empty Redis + advancing serving(t) instantly admits everyone).
  persistence:
    enabled: true
    size: 1Gi
  # PRODUCTION: the in-chart single-pod Redis is a SPOF. Point this at a
  # replicated/managed Redis (ElastiCache / MemoryStore / Sentinel) — when set,
  # the in-chart Redis is not deployed and the service connects here instead.
  external:
    host: ""

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: queue.example.com

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
