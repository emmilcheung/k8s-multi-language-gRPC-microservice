apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-redis
  labels: {{- include "queue-system.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-redis
  template:
    metadata:
      labels:
        app: queue-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: queue-redis
  labels: {{- include "queue-system.labels" . | nindent 4 }}
spec:
  selector:
    app: queue-redis
  ports:
    - port: 6379
      targetPort: 6379
