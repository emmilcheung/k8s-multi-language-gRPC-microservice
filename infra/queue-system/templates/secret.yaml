{{- /* Plain-values Secret, for local clusters. Not rendered when the keys come from secretRef or externalSecrets. */ -}}
{{- if not (or .Values.secretRef .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: queue-secret
  labels: {{- include "queue-system.labels" . | nindent 4 }}
type: Opaque
stringData:
  hmac-secret: {{ .Values.queue.hmacSecret | quote }}
  user-id-signing-key: {{ .Values.queue.userIdSigningKey | quote }}
  {{- with .Values.queue.adminApiKey }}
  admin-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
