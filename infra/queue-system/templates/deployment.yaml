apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
  labels: {{- include "queue-system.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: queue-service
  template:
    metadata:
      labels:
        app: queue-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: queue-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            - name: admin
              containerPort: {{ .Values.queue.adminPort }}
          env:
            - name: Queue__RedisConnection
              value: {{ .Values.redis.external.host | default "queue-redis:6379" | quote }}
            - name: Queue__AdmissionTtlSeconds
              value: {{ .Values.queue.admissionTtlSeconds | quote }}
            - name: Queue__SlidingGraceSeconds
              value: {{ .Values.queue.slidingGraceSeconds | quote }}
            - name: Queue__EnqueuePerMinutePerIp
              value: {{ .Values.queue.enqueuePerMinutePerIp | quote }}
            {{- range $i, $cidr := .Values.queue.trustedProxyCidrs }}
            - name: Queue__TrustedProxyCidrs__{{ $i }}
              value: {{ $cidr | quote }}
            {{- end }}
            {{- range $i, $origin := .Values.queue.allowedTargetOrigins }}
            - name: Queue__AllowedTargetOrigins__{{ $i }}
              value: {{ $origin | quote }}
            {{- end }}
            # The admin routes answer only on this port; it is not in the Ingress.
            - name: Queue__AdminPort
              value: {{ .Values.queue.adminPort | quote }}
            {{- with .Values.queue.venueAvailabilityUrl }}
            - name: Queue__VenueAvailabilityUrl
              value: {{ . | quote }}
            {{- end }}
            # Optional key: absent means the admin API stays unmapped.
            - name: Queue__AdminApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "queue-system.secretName" . }}
                  key: admin-api-key
                  optional: true
            - name: Queue__HmacSecret
              valueFrom:
                secretKeyRef:
                  name: {{ include "queue-system.secretName" . }}
                  key: hmac-secret
            - name: Queue__UserIdSigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "queue-system.secretName" . }}
                  key: user-id-signing-key
          readinessProbe:
            httpGet:
              path: /readyz          # Redis-aware: NotReady if Redis is unreachable
              port: {{ .Values.service.targetPort }}
          livenessProbe:
            httpGet:
              path: /healthz         # process liveness only
              port: {{ .Values.service.targetPort }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
