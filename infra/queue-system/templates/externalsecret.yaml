{{- /*
Fills the Secret queue-service reads (hmac-secret, user-id-signing-key) from an
external store instead of plain values. Same shape as the charts under
infra/helm: dataFrom.extract copies every key of the remote JSON object.
Rotating the remote value does not restart the pods; roll them for it to apply.
*/}}
{{- $es := .Values.externalSecrets -}}
{{- if $es.enabled }}
{{- if not $es.secretStore.name }}
{{- fail "externalSecrets is enabled but no secret store is named: set externalSecrets.secretStore.name" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: queue-secret
  labels: {{- include "queue-system.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $es.secretStore.name }}
    kind: {{ $es.secretStore.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "queue-system.secretName" . }}
    # Owner, so deleting the ExternalSecret deletes the Secret it created.
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $es.remoteKey | default (printf "%s/%s" .Release.Namespace .Chart.Name) | quote }}
{{- end }}
