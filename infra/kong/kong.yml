# Kong declarative configuration (DB-less mode)
# All traffic from external clients enters through Kong on port 8000 (HTTP).
# Kong validates the JWT from the `token` cookie, injects X-User-Id from the
# `sub` claim, then routes to the correct upstream service.
#
# Route layout (mirrors AGENTS.md §2.1 REST conventions):
#   /api/users/*     → auth-service:3000
#   /api/tickets/*   → ticket-service:3001
#   /api/orders/*    → order-service:8082
#   /api/payments/*  → payment-service:3002
#   /.well-known/*   → auth-service:3000  (JWKS — public, no auth)
#
# Auth strategy:
#   - jwt plugin validates the RS256 token read from the `token` cookie.
#   - pre-function plugin reads `kong.ctx.shared.authenticated_jwt_token.claims.sub`
#     (set by the jwt plugin handler) and writes it as X-User-Id on the upstream
#     request. This is the only reliable way to forward the sub claim in Kong OSS;
#     request-transformer cannot reference JWT claim values.
#   - Public routes (signup, signin, GET tickets, JWKS) bypass the jwt plugin.
#
# WARNING: The RSA public key embedded here is a DEV-ONLY key pair whose
# private half lives in services/auth-service/.env (RSA_PRIVATE_KEY).
# Rotate both when moving to staging/production.

_format_version: "3.0"
_transform: true

# ── Consumer: maps the JWT issuer claim to a Kong consumer ──────────────────
# The jwt plugin (OSS) requires a consumer with a jwt_secret entry in DB-less mode.
# key = JWT `iss` claim value (set in auth-service AuthModule: issuer: 'auth-service')
consumers:
  - username: auth-service-issuer
    jwt_secrets:
      - key: auth-service
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAt8uMfbACvz5PukgGGvE4
          CpU20xzm0+ZAmE0SIwjbVl3WKpg9R90b5jjuA9hNOXXjmeWk7oJ6CebASuSoGodq
          B79RYtAf+gk/yU9Glv+CtaCPER2cr6uQhKL23zeF0AbuaS8sjjfOThEcPy4QBtXw
          9V8p6uE+5XAU/wXO33veChvLNuAo20L+FDNJXTR6fXHS3pJiaM7NzgFAnCIuYQsM
          DlBKo8UaqzxXig1yFCp924rPApZ4r/NnGNBiU5xHD3Cz+RpCaX5YffKMJN31P4rd
          cMIZSduteWxEhWXbD/9ilRZKbdVugV0MUcPNG705hn/nZxy2PDcg4L5BOKplYdli
          hwIDAQAB
          -----END PUBLIC KEY-----

# ── Upstream services ────────────────────────────────────────────────────────
services:

  # ── auth-service ────────────────────────────────────────────────────────────
  - name: auth-service
    url: http://auth-service:3000
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      # Public: signup / signin / signout — no JWT required
      - name: auth-public
        paths:
          - /api/users/signup
          - /api/users/signin
          - /api/users/signout
        methods: [POST]
        strip_path: false

      # Protected: currentuser — validates JWT, injects X-User-Id from sub claim
      - name: auth-currentuser
        paths:
          - /api/users/currentuser
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [token]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  local token_str = kong.ctx.shared.authenticated_jwt_token
                  if type(token_str) == "string" then
                    local b64_payload = token_str:match("^[^.]+%.([^.]+)%.")
                    if b64_payload then
                      local pad = (4 - #b64_payload % 4) % 4
                      b64_payload = b64_payload .. string.rep("=", pad)
                      local payload_json = ngx.decode_base64(b64_payload)
                      if payload_json then
                        local sub = payload_json:match('"sub"%s*:%s*"([^"]+)"')
                        if sub then
                          kong.service.request.set_header("X-User-Id", sub)
                        end
                      end
                    end
                  end

      # Public: JWKS endpoint consumed by tooling (no auth)
      - name: auth-jwks
        paths:
          - /.well-known/jwks.json
        methods: [GET]
        strip_path: false

  # ── ticket-service ──────────────────────────────────────────────────────────
  - name: ticket-service
    url: http://ticket-service:3001
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      # Public: list all tickets and get one — no JWT required
      - name: tickets-read
        paths:
          - ~/api/tickets$
          - ~/api/tickets/[^/]+$
        methods: [GET]
        strip_path: false

      # Protected: create / update ticket — JWT required, sub → X-User-Id
      - name: tickets-write
        paths:
          - ~/api/tickets$
          - ~/api/tickets/[^/]+$
        methods: [POST, PUT, PATCH, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [token]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  local token_str = kong.ctx.shared.authenticated_jwt_token
                  if type(token_str) == "string" then
                    local b64_payload = token_str:match("^[^.]+%.([^.]+)%.")
                    if b64_payload then
                      local pad = (4 - #b64_payload % 4) % 4
                      b64_payload = b64_payload .. string.rep("=", pad)
                      local payload_json = ngx.decode_base64(b64_payload)
                      if payload_json then
                        local sub = payload_json:match('"sub"%s*:%s*"([^"]+)"')
                        if sub then
                          kong.service.request.set_header("X-User-Id", sub)
                        end
                      end
                    end
                  end

  # ── order-service ───────────────────────────────────────────────────────────
  - name: order-service
    url: http://order-service:8082
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      # All order endpoints require auth
      - name: orders-collection
        paths:
          - ~/api/orders$
        methods: [GET, POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [token]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  local token_str = kong.ctx.shared.authenticated_jwt_token
                  if type(token_str) == "string" then
                    local b64_payload = token_str:match("^[^.]+%.([^.]+)%.")
                    if b64_payload then
                      local pad = (4 - #b64_payload % 4) % 4
                      b64_payload = b64_payload .. string.rep("=", pad)
                      local payload_json = ngx.decode_base64(b64_payload)
                      if payload_json then
                        local sub = payload_json:match('"sub"%s*:%s*"([^"]+)"')
                        if sub then
                          kong.service.request.set_header("X-User-Id", sub)
                        end
                      end
                    end
                  end

      - name: orders-resource
        paths:
          - ~/api/orders/[^/]+$
        methods: [GET, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [token]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  local token_str = kong.ctx.shared.authenticated_jwt_token
                  if type(token_str) == "string" then
                    local b64_payload = token_str:match("^[^.]+%.([^.]+)%.")
                    if b64_payload then
                      local pad = (4 - #b64_payload % 4) % 4
                      b64_payload = b64_payload .. string.rep("=", pad)
                      local payload_json = ngx.decode_base64(b64_payload)
                      if payload_json then
                        local sub = payload_json:match('"sub"%s*:%s*"([^"]+)"')
                        if sub then
                          kong.service.request.set_header("X-User-Id", sub)
                        end
                      end
                    end
                  end

  # ── payment-service ─────────────────────────────────────────────────────────
  - name: payment-service
    url: http://payment-service:3002
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      # All payment endpoints require auth
      - name: payments-collection
        paths:
          - ~/api/payments$
        methods: [GET, POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [token]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  local token_str = kong.ctx.shared.authenticated_jwt_token
                  if type(token_str) == "string" then
                    local b64_payload = token_str:match("^[^.]+%.([^.]+)%.")
                    if b64_payload then
                      local pad = (4 - #b64_payload % 4) % 4
                      b64_payload = b64_payload .. string.rep("=", pad)
                      local payload_json = ngx.decode_base64(b64_payload)
                      if payload_json then
                        local sub = payload_json:match('"sub"%s*:%s*"([^"]+)"')
                        if sub then
                          kong.service.request.set_header("X-User-Id", sub)
                        end
                      end
                    end
                  end

      - name: payments-resource
        paths:
          - ~/api/payments/[^/]+$
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [token]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  local token_str = kong.ctx.shared.authenticated_jwt_token
                  if type(token_str) == "string" then
                    local b64_payload = token_str:match("^[^.]+%.([^.]+)%.")
                    if b64_payload then
                      local pad = (4 - #b64_payload % 4) % 4
                      b64_payload = b64_payload .. string.rep("=", pad)
                      local payload_json = ngx.decode_base64(b64_payload)
                      if payload_json then
                        local sub = payload_json:match('"sub"%s*:%s*"([^"]+)"')
                        if sub then
                          kong.service.request.set_header("X-User-Id", sub)
                        end
                      end
                    end
                  end

# ── Global plugins ────────────────────────────────────────────────────────────
plugins:
  # Inject a correlation ID on every request for distributed tracing
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true
