spring:
  application:
    name: order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username='${KAFKA_SASL_USERNAME:}' password='${KAFKA_SASL_PASSWORD:}';"
      ssl.endpoint.identification.algorithm: ${KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:https}
    admin:
      fail-fast: false        # do not crash context if broker is unreachable at startup
      auto-create: false      # do not attempt to create topics (KafkaAdmin blocks on broker connect)
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        # request.timeout.ms must be <= delivery.timeout.ms - linger.ms
        # Set request timeout to 5 s so delivery.timeout.ms (10 s) satisfies the constraint
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.in.flight.requests.per.connection: 1
    listener:
      ack-mode: MANUAL_IMMEDIATE
      missing-topics-fatal: false   # do not crash if a subscribed topic doesn't exist yet
      observation-enabled: true     # SB4/Spring Kafka 4: auto-instrument @KafkaListener with OTel spans
    template:
      observation-enabled: true     # SB4/Spring Kafka 4: auto-instrument KafkaTemplate.send()

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false     # moved from serialization in Jackson 3
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0          # lower to 0.1 in production
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/metrics}

grpc:
  ticket-service:
    host: ${TICKET_SERVICE_GRPC_HOST:localhost}
    port: ${TICKET_SERVICE_GRPC_PORT:50051}
  venue-service:
    host: ${VENUE_SERVICE_GRPC_HOST:localhost}
    port: ${VENUE_SERVICE_GRPC_PORT:50052}

redis:
  url: ${REDIS_URL:redis://localhost:6379}

order:
  expiration:
    minutes: ${ORDER_EXPIRATION_MINUTES:15}

outbox:
  relay:
    # Poll interval for the transactional outbox relay in milliseconds.
    # Default 5 000 ms (~12×/min) keeps event latency well within the 15-min expiry window
    # while reducing DB queries and OTel spans ~10× vs the previous 500 ms fixed delay.
    # Override via OUTBOX_RELAY_POLL_INTERVAL_MS env var for lower-latency environments.
    poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:5000}

# ── Resilience4j — circuit breaker on gRPC client (R-01) ─────────────────────
resilience4j:
  circuitbreaker:
    instances:
      ticketService:
        # Open when 50 % of the last 10 calls fail
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        # Wait 30 s in OPEN state before switching to HALF_OPEN
        waitDurationInOpenState: 30s
        # Allow 3 trial calls in HALF_OPEN before deciding
        permittedNumberOfCallsInHalfOpenState: 3
        # Throw CallNotPermittedException when OPEN (caught by fallback)
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Record gRPC StatusRuntimeException and all its subtypes as failures
        recordExceptions:
          - io.grpc.StatusRuntimeException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        # ResponseStatusException means the gRPC error was already translated to a
        # valid HTTP response (e.g. 404, 409) — do not intercept with fallback
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException
      venueService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - io.grpc.StatusRuntimeException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException
