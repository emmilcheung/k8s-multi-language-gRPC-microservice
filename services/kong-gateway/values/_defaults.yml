# Kong gateway — default values
# ─────────────────────────────
# These are the safe defaults shared across all environments.
# Per-environment files (local.yml, minikube.yml, dev.yml, staging.yml, prod.yml)
# override only the keys that differ.
#
# RSA_PUBLIC_KEY is NOT defined here — it must always come from the environment
# variable KONG_RSA_PUBLIC_KEY passed to build.sh at render time.
# SIGNING_KEY is also injected via environment (KONG_SIGNING_KEY) at render time.
# ── Service upstream hostnames (host:port) ─────────────────────────────────────
HOST_AUTH: auth-service:3000
HOST_TICKETS: ticket-service:3001
HOST_ORDERS: order-service:8082
HOST_PAYMENTS: payment-service:3002
HOST_USERS: user-service:3004
HOST_ATTENDANCE: attendance-service:3007
HOST_CLIENT: client:4000
HOST_VENUE: venue-service:3003
HOST_APOLLO_ROUTER: apollo-router:4001

# ── Timeouts (milliseconds) ────────────────────────────────────────────────────
CONNECT_TIMEOUT_MS: 5000
READ_TIMEOUT_MS: 10000
WRITE_TIMEOUT_MS: 10000
# Next.js SSR pages can be slow; give the client-service more headroom.
CLIENT_READ_TIMEOUT_MS: 30000
CLIENT_WRITE_TIMEOUT_MS: 30000
GRAPHQL_READ_TIMEOUT_MS: 30000
# SSE streams must stay open for minutes; needs a dedicated long timeout.
SSE_READ_TIMEOUT_MS: 300000

# ── JWT ────────────────────────────────────────────────────────────────────────
JWT_COOKIE_NAME: token

# ── Anonymous GraphQL credential ───────────────────────────────────────────────
# Synthetic JWT injected on /graphql when no client credential is present.
# Purpose: lets the JWT plugin stay in strict mode (rejects malformed tokens with
# 401) while still allowing public queries (ticket browse) through without a
# real user token. The token carries no `sub`/`roles` claims, so jwt-sub.lua
# emits no X-User-Id; resolvers requiring auth still reject unauthenticated
# requests. The "secret" is intentionally a non-secret — even if leaked, the
# token grants no access (no claims that grant identity).
# Signed HS256 with payload {"iss":"anonymous-graphql","exp":4102444800}.
ANONYMOUS_GRAPHQL_JWT_SECRET: "anonymous-graphql-not-a-secret-grants-no-access"
ANONYMOUS_GRAPHQL_JWT: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhbm9ueW1vdXMtZ3JhcGhxbCIsImV4cCI6NDEwMjQ0NDgwMH0.vr2WMhDQhVsv4m45UWn_Nnwif1r6LXIlRRip2PM3mKE"

# ── Rate limiting ──────────────────────────────────────────────────────────────
# policy: local  — in-process counter per Kong node (suitable for dev/local)
# policy: redis  — shared counter across all Kong nodes (required in production)
RATE_LIMIT_ANONYMOUS_PER_MINUTE: 300
RATE_LIMIT_POLICY: local
RATE_LIMIT_AUTHENTICATED_PER_MINUTE: 1000
RATE_LIMIT_AUTH_ENDPOINTS_PER_MINUTE: 60
RATE_LIMIT_ATTENDANCE_SCAN_PER_MINUTE: 60
RATE_LIMIT_REDIS_HOST: "127.0.0.1"
RATE_LIMIT_REDIS_PORT: 6379

# ── CORS ──────────────────────────────────────────────────────────────────────
CORS_ALLOWED_ORIGINS: "*"

# ── Virtual waiting room backstop ──────────────────────────────────────────────
# Inert unless QUEUE_GATE_ARMED is "true". When armed, reserve mutations on
# /graphql require a valid qq_pass cookie (HMAC-SHA256, shared with the
# queue-service and client). Must equal the queue-service Queue__HmacSecret.
QUEUE_GATE_ARMED: "false"
QUEUE_HMAC_SECRET: "dev-secret-change-me-32-chars-minimum"
