# Kong declarative configuration — BASE TEMPLATE
# ─────────────────────────────────────────────
# Do NOT use this file directly.  build.sh merges this template with a
# per-environment values file (values/<env>.yml) to produce a rendered kong.yml.
#
# Placeholder syntax:  {{VARIABLE_NAME}}
# All placeholders are defined (with safe defaults) in values/_defaults.yml and
# overridden per environment in values/<env>.yml.
#
# Route layout (mirrors AGENTS.md §2.1):
#   POST /api/users/signup|signin|signout  → auth-service   (public)
#   GET  /api/users/currentuser            → auth-service   (JWT required)
#   GET  /.well-known/jwks.json            → auth-service   (public)
#   GET  /api/tickets/*                    → ticket-service (public)
#   *    /api/tickets/*                    → ticket-service (JWT required)
#   *    /api/orders/*                     → order-service  (JWT required)
#   *    /api/payments/*                   → payment-service (JWT required)
#   *    /api/user-settings/*              → user-service   (JWT required)
#   /*                                     → client         (catch-all, no JWT)
#
# Auth strategy:
#   jwt plugin validates RS256 token from the {{JWT_COOKIE_NAME}} cookie.
#   post-function (plugins/jwt-sub.lua) extracts sub → X-User-Id header.
#   Public routes bypass the jwt plugin entirely.

_format_version: "3.0"
_transform: true

# ── Consumer ──────────────────────────────────────────────────────────────────
# Kong OSS DB-less jwt plugin requires a consumer + jwt_secret entry.
# key must match the JWT `iss` claim (auth-service sets iss: "auth-service").
consumers:
  - username: auth-service-issuer
    jwt_secrets:
      - key: auth-service
        algorithm: RS256
        rsa_public_key: |
          {{RSA_PUBLIC_KEY}}
    # Consumer-scoped rate limit — authenticated users get a higher allowance.
    # Attaching it here (on the consumer) rather than as a second global plugin
    # avoids the duplicate-global-plugin issue in Kong OSS DB-less mode (I-19).
    plugins:
      - name: rate-limiting
        config:
          minute: {{RATE_LIMIT_AUTHENTICATED_PER_MINUTE}}
          limit_by: consumer
          policy: {{RATE_LIMIT_POLICY}}
          redis_host: {{RATE_LIMIT_REDIS_HOST}}
          redis_port: {{RATE_LIMIT_REDIS_PORT}}
          fault_tolerant: true
          hide_client_headers: false

# ── Upstream services ─────────────────────────────────────────────────────────
services:

  # ── auth-service ─────────────────────────────────────────────────────────────
  - name: auth-service
    url: http://{{HOST_AUTH}}
    connect_timeout: {{CONNECT_TIMEOUT_MS}}
    read_timeout: {{READ_TIMEOUT_MS}}
    write_timeout: {{WRITE_TIMEOUT_MS}}
    routes:
      # OAuth: public endpoints — no JWT required.
      # Handles Authorization Code + PKCE flow for native clients (MCP servers).
      # Rate-limited identically to other auth endpoints to prevent code-exchange abuse.
      - name: oauth-public
        paths:
          - /oauth/authorize
          - /oauth/token
          - /oauth/revoke
          - /oauth/clients/register
        methods: [GET, POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: {{RATE_LIMIT_AUTH_ENDPOINTS_PER_MINUTE}}
              limit_by: ip
              policy: {{RATE_LIMIT_POLICY}}
              redis_host: {{RATE_LIMIT_REDIS_HOST}}
              redis_port: {{RATE_LIMIT_REDIS_PORT}}
              fault_tolerant: true
              hide_client_headers: false

      # OAuth: consent query — public GET so Next.js server can fetch pending consent details.
      - name: oauth-consent-query
        paths:
          - ~/oauth/consent/[^/]+$
        methods: [GET]
        strip_path: false

      # OAuth: consent approval — JWT required (cookie); user confirms or denies.
      # X-User-Id is injected so auth-service can verify the consenting user matches.
      - name: oauth-consent-approve
        paths:
          - ~/oauth/consent/[^/]+$
        methods: [POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      # OAuth: client management — JWT required (cookie or Bearer header).
      # Lists and revokes OAuth sessions for the authenticated user.
      - name: oauth-clients
        paths:
          - ~/oauth/clients$
          - ~/oauth/clients/[^/]+$
        methods: [GET, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      # Public: signup / signin / signout / refresh — no JWT required.
      # /api/auth/refresh is public because auth-service validates the
      # refresh token cookie itself (Redis lookup); Kong must not block it
      # with a JWT check (the access token is already expired when refreshing).
      - name: auth-public
        paths:
          - /api/users/signup
          - /api/users/signin
          - /api/users/signout
          - /api/auth/refresh
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: {{RATE_LIMIT_AUTH_ENDPOINTS_PER_MINUTE}}
              limit_by: ip
              policy: {{RATE_LIMIT_POLICY}}
              redis_host: {{RATE_LIMIT_REDIS_HOST}}
              redis_port: {{RATE_LIMIT_REDIS_PORT}}
              fault_tolerant: true
              hide_client_headers: false

      # Protected: currentuser — validates JWT, injects X-User-Id from sub
      - name: auth-currentuser
        paths:
          - /api/users/currentuser
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      # Protected: session management — validates JWT and injects X-User-Id.
      - name: auth-sessions-list
        paths:
          - ~/api/users/sessions$
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: auth-sessions-revoke
        paths:
          - ~/api/users/sessions/[^/]+$
        methods: [DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      # Public: JWKS endpoint (consumed by Kong itself + tooling)
      - name: auth-jwks
        paths:
          - /.well-known/jwks.json
        methods: [GET]
        strip_path: false

  # ── ticket-service ────────────────────────────────────────────────────────────
  - name: ticket-service
    url: http://{{HOST_TICKETS}}
    connect_timeout: {{CONNECT_TIMEOUT_MS}}
    read_timeout: {{READ_TIMEOUT_MS}}
    write_timeout: {{WRITE_TIMEOUT_MS}}
    routes:
      # Public: read-only ticket access — no JWT required
      - name: tickets-read
        paths:
          - ~/api/tickets$
          - ~/api/tickets/[^/]+$
        methods: [GET]
        strip_path: false

      # Protected: create / update / delete ticket — JWT required
      - name: tickets-write
        paths:
          - ~/api/tickets$
          - ~/api/tickets/[^/]+$
          - ~/api/tickets/[^/]+/seating-plan$
        methods: [POST, PUT, PATCH, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

  # ── order-service ─────────────────────────────────────────────────────────────
  - name: order-service
    url: http://{{HOST_ORDERS}}
    connect_timeout: {{CONNECT_TIMEOUT_MS}}
    read_timeout: {{READ_TIMEOUT_MS}}
    write_timeout: {{WRITE_TIMEOUT_MS}}
    routes:
      - name: orders-collection-read
        paths:
          - ~/api/orders$
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:orders:read}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: orders-collection-write
        paths:
          - ~/api/orders$
          - ~/api/orders/seated$
        methods: [POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:orders:create}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: orders-resource-read
        paths:
          - ~/api/orders/[^/]+$
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:orders:read}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: orders-resource-cancel
        paths:
          - ~/api/orders/[^/]+$
        methods: [DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:orders:cancel}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

  # ── payment-service ───────────────────────────────────────────────────────────
  - name: payment-service
    url: http://{{HOST_PAYMENTS}}
    connect_timeout: {{CONNECT_TIMEOUT_MS}}
    read_timeout: {{READ_TIMEOUT_MS}}
    write_timeout: {{WRITE_TIMEOUT_MS}}
    routes:
      # Stripe webhook — unauthenticated (Stripe cannot present a JWT).
      # Must be declared BEFORE payments-collection so Kong matches it first.
      - name: payments-webhook
        paths:
          - ~/api/payments/webhook$
        methods: [POST]
        strip_path: false

      - name: payments-collection-read
        paths:
          - ~/api/payments$
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:payments:read}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: payments-collection-write
        paths:
          - ~/api/payments$
        methods: [POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:payments:create}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      # Saved payment methods routes must be matched before payments-resource
      # so /api/payments/methods is not captured as a payment ID.
      - name: payments-methods-read
        paths:
          - ~/api/payments/methods$
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:payments:read}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: payments-methods-register
        paths:
          - ~/api/payments/methods/register$
        methods: [POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:payments:create}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: payments-methods-default
        paths:
          - ~/api/payments/methods/[^/]+/default$
        methods: [PATCH]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:payments:create}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: payments-methods-delete
        paths:
          - ~/api/payments/methods/[^/]+$
        methods: [DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:payments:create}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      - name: payments-resource
        paths:
          - ~/api/payments/[^/]+$
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: pre-function
            config:
              access:
                - |
                  {{SCOPE_CHECK_LUA:payments:read}}
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

  # ── user-service ─────────────────────────────────────────────────────────────
  - name: user-service
    url: http://{{HOST_USERS}}
    connect_timeout: {{CONNECT_TIMEOUT_MS}}
    read_timeout: {{READ_TIMEOUT_MS}}
    write_timeout: {{WRITE_TIMEOUT_MS}}
    routes:
      - name: user-settings
        paths:
          - ~/api/user-settings/profile$
          - ~/api/user-settings/preferences$
          - ~/api/user-settings/billing-address$
        methods: [GET, PUT]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}


  # ── venue-service ─────────────────────────────────────────────────────────────
  - name: venue-service
    url: http://{{HOST_VENUE}}
    connect_timeout: {{CONNECT_TIMEOUT_MS}}
    read_timeout: {{READ_TIMEOUT_MS}}
    write_timeout: {{WRITE_TIMEOUT_MS}}
    routes:
      # Public: read-only seating-plan access (availability, sections, tiers) — no JWT required
      - name: venue-seating-plans-read
        paths:
          - ~/api/seating-plans/[^/]+$
          - ~/api/seating-plans/[^/]+/availability$
          - ~/api/seating-plans/[^/]+/sections$
          - ~/api/seating-plans/[^/]+/price-tiers$
        methods: [GET]
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: [GET, OPTIONS]
              headers: [Content-Type, Authorization]
              exposed_headers: [X-Request-Id]
              max_age: 3600
              credentials: false

      # Protected: create / update / activate seating plans and sections — JWT required
      - name: venue-seating-plans-write
        paths:
          - ~/api/seating-plans$
          - ~/api/seating-plans/[^/]+$
          - ~/api/seating-plans/[^/]+/sections$
          - ~/api/seating-plans/[^/]+/price-tiers$
          - ~/api/seating-plans/[^/]+/attach-ticket$
          - ~/api/seating-plans/[^/]+/activate$
          - ~/api/seating-plans/[^/]+/layout$
          - ~/api/seating-plans/[^/]+/seats/hold$
          - ~/api/seating-plans/[^/]+/seats/release$
          - ~/api/seating-plans/[^/]+/holds$
          - ~/api/seating-plans/[^/]+/holds/[^/]+$
        methods: [POST, PUT, PATCH, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      # Protected: list seating plans by venue — JWT required (organizer-scoped)
      - name: venue-seating-plans-list
        paths:
          - ~/api/seating-plans$
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      # Protected: catch-all for nested plan write paths not listed explicitly above
      - name: venue-seating-plans-nested-write
        paths:
          - ~/api/seating-plans/[^/]+(/.*)?$
        methods: [POST,PUT,PATCH,DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

      # Protected: venue management — JWT required for all operations
      - name: venue-venues
        paths:
          - ~/api/venues$
          - ~/api/venues/[^/]+$
          - ~/api/venues/[^/]+/sections$
          - ~/api/venues/[^/]+/sections/[^/]+$
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              cookie_names: [{{JWT_COOKIE_NAME}}]
              header_names: [Authorization]
              claims_to_verify: [exp]
          - name: post-function
            config:
              access:
                - |
                  {{JWT_SUB_LUA}}

  # ── venue-service SSE — dedicated service with long read timeout ─────────────
  # A separate service entry is required because Kong timeouts are per-service, not
  # per-route. The regular venue-service uses READ_TIMEOUT_MS (10 s), which is
  # shorter than the SSE heartbeat interval and would terminate the stream.
  # The post-function disables nginx proxy buffering so heartbeat frames are
  # flushed immediately to the browser instead of being held in Kong's buffer.
  - name: venue-service-sse
    url: http://{{HOST_VENUE}}
    connect_timeout: {{CONNECT_TIMEOUT_MS}}
    read_timeout: {{SSE_READ_TIMEOUT_MS}}
    write_timeout: {{SSE_READ_TIMEOUT_MS}}
    routes:
      - name: venue-seating-plans-sse
        paths:
          - ~/api/seating-plans/[^/]+/events$
        methods: [GET]
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: [GET, OPTIONS]
              headers: [Content-Type]
              exposed_headers: [X-Request-Id]
              max_age: 3600
              credentials: false
          - name: post-function
            config:
              header_filter:
                - |
                  -- Force X-Accel-Buffering: no on SSE responses so nginx does
                  -- not buffer the stream. The upstream already sets this header
                  -- but Kong may strip or override it before nginx checks it.
                  -- Setting it here in header_filter ensures nginx sees it on
                  -- every response from this route (K-SSE-01).
                  ngx.header["X-Accel-Buffering"] = "no"

  # ── client (Next.js SSR) — catch-all, must be last ────────────────────────────
  # Kong matches routes by longest-prefix first; all /api/* routes above always
  # win.  The client route has a higher read/write timeout to accommodate SSR.
  - name: client-service
    url: http://{{HOST_CLIENT}}
    connect_timeout: {{CONNECT_TIMEOUT_MS}}
    read_timeout: {{CLIENT_READ_TIMEOUT_MS}}
    write_timeout: {{CLIENT_WRITE_TIMEOUT_MS}}
    routes:
      - name: client-catchall
        paths:
          - /
        strip_path: false
        # No jwt plugin — Next.js manages session display via the cookie set by
        # auth-service.  Kong must not block unauthenticated page loads.
        plugins:
          # Next.js 15+ Server Actions CSRF protection compares the `origin` header
          # against `x-forwarded-host` (preferred) or `host`.  By default Kong
          # rewrites the Host header to the upstream hostname
          # (ticketing-client.ticketing.svc.cluster.local), so the check fails and
          # every Server Action returns 500 "Invalid Server Actions request."
          # Fix: inject X-Forwarded-Host with the value of the Host header Kong
          # received from the browser, so Next.js sees origin == x-forwarded-host.
          - name: post-function
            config:
              access:
                - |
                  -- Next.js 15+ CSRF check: compares new URL(origin).host against
                  -- x-forwarded-host (or host).  Kong rewrites the Host header to
                  -- the upstream hostname, breaking the comparison.
                  --
                  -- Kong's nginx template unconditionally overwrites X-Forwarded-Host
                  -- from the $upstream_x_forwarded_host nginx variable (set in
                  -- runloop/handler.lua from the parsed `host` var, which strips the
                  -- port).  kong.service.request.set_header() is overwritten too.
                  --
                  -- Fix: overwrite the nginx variable $upstream_x_forwarded_host
                  -- directly via ngx.var, so Kong's proxy_set_header directive uses
                  -- our corrected value.  get_header("host") returns the raw Host
                  -- header including port (e.g. "localhost:8000"), which is exactly
                  -- what new URL(origin).host produces in Next.js's CSRF check.
                  local raw_host = kong.request.get_header("host")
                  if raw_host then
                    ngx.var.upstream_x_forwarded_host = raw_host
                  end

# ── Global plugins ─────────────────────────────────────────────────────────────
plugins:
  # Strip identity headers on every inbound request before any route plugin runs.
  # Prevents external clients from forging X-User-Id / X-User-Roles on public
  # routes that do not run the JWT plugin.  The jwt post-function then sets these
  # headers authoritatively on protected routes after token validation.
  # Plugin execution order: global → service → route → consumer, so this always
  # runs first regardless of route-level plugins.  (Fixes audit finding S-02.)
  - name: request-transformer
    config:
      remove:
        headers:
          - X-User-Id
          - X-User-Roles

  # Inject a correlation ID on every request for distributed tracing
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true

  # Expose gateway metrics on Kong's status listener for local Prometheus
  # scraping and future managed backends behind the same collector boundary.
  - name: prometheus

  # Rate limiting — backed by Redis in production; local counter in dev
  # IP-based limit for anonymous (unauthenticated) requests.
  # Authenticated consumers get a higher limit via the consumer-scoped plugin
  # on the auth-service-issuer consumer (defined above) — avoids duplicate
  # global plugin instances that Kong OSS DB-less mode does not support (I-19).
  - name: rate-limiting
    config:
      minute: {{RATE_LIMIT_ANONYMOUS_PER_MINUTE}}
      limit_by: ip
      policy: {{RATE_LIMIT_POLICY}}
      redis_host: {{RATE_LIMIT_REDIS_HOST}}
      redis_port: {{RATE_LIMIT_REDIS_PORT}}
      fault_tolerant: true
      hide_client_headers: false

  # Request size limiting — reject oversized request bodies before they reach
  # upstream services (R-09).  Default cap of 1 MB covers all REST API payloads;
  # adjust per-route for any endpoint that legitimately needs larger bodies.
  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes
      require_content_length: false
