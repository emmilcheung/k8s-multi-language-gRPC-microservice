supergraph:
  listen: 0.0.0.0:4001
  path: /graphql

# limits (max_depth, max_height, etc.) require a GraphOS Enterprise license.
# They are configured in the Helm chart (infra/helm/charts/apollo-router/files/router.yaml)
# for staging/production deployments connected to GraphOS.

headers:
  all:
    request:
      - propagate:
          named: x-user-id
      - propagate:
          named: x-user-roles
      - propagate:
          named: x-user-id-sig
      - propagate:
          named: traceparent
      - propagate:
          named: tracestate
  subgraphs:
    auth:
      request:
        - propagate:
            named: cookie

telemetry:
  exporters:
    tracing:
      otlp:
        enabled: true
        endpoint: "${env.OTEL_EXPORTER_OTLP_ENDPOINT}"
        protocol: grpc
    metrics:
      otlp:
        enabled: true
        endpoint: "${env.OTEL_EXPORTER_OTLP_ENDPOINT}"
        protocol: grpc
        temporality: delta
  instrumentation:
    spans:
      mode: spec_compliant
