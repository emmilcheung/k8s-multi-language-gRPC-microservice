supergraph:
  listen: 0.0.0.0:4001
  path: /graphql

# Surface subgraph errors verbatim in CI/local. In production this should be
# scoped to specific subgraphs (or off) so internal stack traces don't leak,
# but for the local docker-compose + CI stack the error masking blocks
# E2E debugging completely. Re-evaluate before promoting to staging.
include_subgraph_errors:
  all: true

# limits (max_depth, max_height, etc.) require a GraphOS Enterprise license.
# They are configured in the Helm chart (infra/helm/charts/apollo-router/files/router.yaml)
# for staging/production deployments connected to GraphOS.

headers:
  all:
    request:
      - propagate:
          named: x-user-id
      - propagate:
          named: x-user-roles
      - propagate:
          named: x-user-id-sig
      - propagate:
          named: traceparent
      - propagate:
          named: tracestate
telemetry:
  exporters:
    tracing:
      otlp:
        enabled: true
        endpoint: "${env.OTEL_EXPORTER_OTLP_ENDPOINT}"
        protocol: grpc
    metrics:
      otlp:
        enabled: true
        endpoint: "${env.OTEL_EXPORTER_OTLP_ENDPOINT}"
        protocol: grpc
        temporality: delta
  instrumentation:
    spans:
      mode: spec_compliant
