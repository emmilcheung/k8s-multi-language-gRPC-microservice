schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/tag/v0.3")
{
  query: Query
  mutation: Mutation
}

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

directive @tag(name: String!) repeatable on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION | SCHEMA

type AdmissionPass
  @join__type(graph: ATTENDANCE, key: "id")
{
  id: ID!
  ticketId: ID!
  orderId: ID!
  eventId: ID!
  status: CredentialStatus!
  issuedAt: String!
  usedAt: String
}

enum AssignmentMode
  @join__type(graph: VENUES)
{
  MANUAL @join__enumValue(graph: VENUES)
  AUTO @join__enumValue(graph: VENUES)
}

type AttendancePolicy
  @join__type(graph: ATTENDANCE)
{
  eventId: ID!
  requireQrForEntry: Boolean!
  allowManualOverride: Boolean!
}

type AttendanceSummary
  @join__type(graph: ATTENDANCE)
{
  eventId: ID!
  totalAdmitted: Int!
  totalDenied: Int!
  totalCheckedIn: Int!
}

type BillingAddress
  @join__type(graph: USERS)
{
  line1: String
  line2: String
  city: String
  state: String
  postalCode: String
  country: String
}

input CreateOrderInput
  @join__type(graph: ORDERS)
{
  ticketId: ID!
  quantity: Int!
}

input CreatePaymentInput
  @join__type(graph: PAYMENTS)
{
  orderId: ID!
  token: String!
}

input CreatePriceTierInput
  @join__type(graph: VENUES)
{
  name: String!
  price: String!
}

input CreateSeatingPlanInput
  @join__type(graph: VENUES)
{
  venueId: ID!
  ticketId: ID!
  name: String!
  maxSeatsPerOrder: Int
  assignmentMode: AssignmentMode!
  pricingMode: String
}

input CreateSectionInput
  @join__type(graph: VENUES)
{
  name: String!
  type: SectionType!
  rowCount: Int
  columnCount: Int!
  displayOrder: Int
}

input CreateTicketInput
  @join__type(graph: TICKETS)
{
  title: String!
  price: Int!
  quota: Int!
  maxPerUser: Int
  ticketType: TicketType!
}

input CreateVenueInput
  @join__type(graph: VENUES)
{
  name: String!
  capacity: Int!
  timezone: String!
  address: String
}

enum CredentialStatus
  @join__type(graph: ATTENDANCE)
{
  ISSUED @join__enumValue(graph: ATTENDANCE)
  USED @join__enumValue(graph: ATTENDANCE)
  REVOKED @join__enumValue(graph: ATTENDANCE)
  EXPIRED @join__enumValue(graph: ATTENDANCE)
}

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar join__DirectiveArguments

scalar join__FieldSet

scalar join__FieldValue

enum join__Graph {
  ATTENDANCE @join__graph(name: "attendance", url: "http://attendance-service:3005/graphql")
  AUTH @join__graph(name: "auth", url: "http://auth-service:3000/graphql")
  ORDERS @join__graph(name: "orders", url: "http://order-service:8082/graphql")
  PAYMENTS @join__graph(name: "payments", url: "http://payment-service:3002/graphql")
  TICKETS @join__graph(name: "tickets", url: "http://ticket-service:3001/graphql")
  USERS @join__graph(name: "users", url: "http://user-service:3004/graphql")
  VENUES @join__graph(name: "venues", url: "http://venue-service:3003/graphql")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Mutation
  @join__type(graph: ORDERS)
  @join__type(graph: PAYMENTS)
  @join__type(graph: TICKETS)
  @join__type(graph: VENUES)
{
  createOrder(input: CreateOrderInput!): Order! @join__field(graph: ORDERS)
  cancelOrder(id: ID!): Order! @join__field(graph: ORDERS)
  createPayment(input: CreatePaymentInput!): Payment! @join__field(graph: PAYMENTS)
  createTicket(input: CreateTicketInput!): Ticket! @join__field(graph: TICKETS)
  updateTicket(id: ID!, input: UpdateTicketInput!): Ticket! @join__field(graph: TICKETS)
  createVenue(input: CreateVenueInput!): Venue! @join__field(graph: VENUES)
  updateVenue(id: ID!, input: UpdateVenueInput!): Venue! @join__field(graph: VENUES)
  createSection(venueId: ID!, input: CreateSectionInput!): VenueSection! @join__field(graph: VENUES)
  updateSection(id: ID!, input: UpdateSectionInput!): VenueSection! @join__field(graph: VENUES)
  createSeatingPlan(input: CreateSeatingPlanInput!): SeatingPlan! @join__field(graph: VENUES)
  updateSeatingPlan(id: ID!, input: UpdateSeatingPlanInput!): SeatingPlan! @join__field(graph: VENUES)
  activateSeatingPlan(id: ID!): SeatingPlan! @join__field(graph: VENUES)
  deactivateSeatingPlan(id: ID!): SeatingPlan! @join__field(graph: VENUES)
  createPriceTier(planId: ID!, input: CreatePriceTierInput!): PriceTier! @join__field(graph: VENUES)
  holdSeats(planId: ID!, seatIds: [ID!]!): SeatHoldResult! @join__field(graph: VENUES)
  releaseSeats(planId: ID!, seatIds: [ID!]!): Boolean! @join__field(graph: VENUES)
}

type Order
  @join__type(graph: ORDERS, key: "id")
{
  id: ID!
  userId: ID!
  ticket: OrderTicket!
  quantity: Int!
  status: OrderStatus!
  expiresAt: String
  createdAt: String!
  payment: Payment
}

enum OrderStatus
  @join__type(graph: ORDERS)
{
  CREATED @join__enumValue(graph: ORDERS)
  AWAITING_PAYMENT @join__enumValue(graph: ORDERS)
  COMPLETE @join__enumValue(graph: ORDERS)
  CANCELLED @join__enumValue(graph: ORDERS)
}

type OrderTicket
  @join__type(graph: ORDERS)
{
  id: ID!
  title: String!
  price: String!
}

type Payment
  @join__type(graph: ORDERS, key: "orderId", resolvable: false)
  @join__type(graph: PAYMENTS, key: "id")
  @join__type(graph: PAYMENTS, key: "orderId")
{
  orderId: ID!
  id: ID! @join__field(graph: PAYMENTS)
  amount: Int! @join__field(graph: PAYMENTS)
  currency: String! @join__field(graph: PAYMENTS)
  status: PaymentStatus! @join__field(graph: PAYMENTS)
  createdAt: String! @join__field(graph: PAYMENTS)
}

enum PaymentStatus
  @join__type(graph: PAYMENTS)
{
  PENDING @join__enumValue(graph: PAYMENTS)
  CAPTURED @join__enumValue(graph: PAYMENTS)
  FAILED @join__enumValue(graph: PAYMENTS)
  REFUNDED @join__enumValue(graph: PAYMENTS)
}

enum PlanStatus
  @join__type(graph: VENUES)
{
  DRAFT @join__enumValue(graph: VENUES)
  ACTIVE @join__enumValue(graph: VENUES)
  ARCHIVED @join__enumValue(graph: VENUES)
}

type PriceTier
  @join__type(graph: VENUES)
{
  id: ID!
  planId: ID!
  name: String!
  price: String!
}

type Query
  @join__type(graph: ATTENDANCE)
  @join__type(graph: AUTH)
  @join__type(graph: ORDERS)
  @join__type(graph: PAYMENTS)
  @join__type(graph: TICKETS)
  @join__type(graph: USERS)
  @join__type(graph: VENUES)
{
  admissionPass(ticketId: ID!, orderId: ID): AdmissionPass @join__field(graph: ATTENDANCE)
  attendancePolicy(eventId: ID!): AttendancePolicy @join__field(graph: ATTENDANCE)
  attendanceSummary(eventId: ID!): AttendanceSummary @join__field(graph: ATTENDANCE)
  currentUser: User @join__field(graph: AUTH)
  order(id: ID!): Order @join__field(graph: ORDERS)
  orders: [Order!]! @join__field(graph: ORDERS)
  payment(id: ID!): Payment @join__field(graph: PAYMENTS)
  tickets: [Ticket!]! @join__field(graph: TICKETS)
  ticket(id: ID!): Ticket @join__field(graph: TICKETS)
  seatingPlan(id: ID!): SeatingPlan @join__field(graph: VENUES)
}

type Seat
  @join__type(graph: VENUES)
{
  id: ID!
  label: String!
  price: Int!
  status: SeatStatus!
}

type SeatHoldResult
  @join__type(graph: VENUES)
{
  held: [ID!]!
