}

enum SeatStatus
  @join__type(graph: VENUES)
{
  AVAILABLE @join__enumValue(graph: VENUES)
  HELD @join__enumValue(graph: VENUES)
  SOLD @join__enumValue(graph: VENUES)
}

type Section
  @join__type(graph: VENUES)
{
  id: ID!
  name: String!
