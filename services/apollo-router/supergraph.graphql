type User
  @join__type(graph: AUTH, key: "id")
  @join__type(graph: ORDERS, key: "id")
  @join__type(graph: USERS, key: "id")
{
  id: ID! @join__field(graph: AUTH) @join__field(graph: ORDERS) @join__field(graph: USERS, external: true)
  email: String @join__field(graph: AUTH) @tag(name: "self-only")
  orders: [Order!]! @join__field(graph: ORDERS) @tag(name: "self-only")
  profile: UserProfile @join__field(graph: USERS) @tag(name: "self-only")
  preferences: UserPreferences @join__field(graph: USERS) @tag(name: "self-only")
}

type UserPreferences
  @join__type(graph: USERS)
{
  marketingOptIn: Boolean
  orderUpdates: Boolean
  productUpdates: Boolean
}

type UserProfile
  @join__type(graph: USERS)
{
  displayName: String
  locale: String
  timezone: String
