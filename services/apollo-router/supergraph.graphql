  @join__type(graph: VENUES)
{
  name: String
  maxSeatsPerOrder: Int
  assignmentMode: AssignmentMode
  pricingMode: String
}

input UpdateSectionInput
  @join__type(graph: VENUES)
{
  name: String
  rowCount: Int
  columnCount: Int
  displayOrder: Int
}

input UpdateTicketInput
  @join__type(graph: TICKETS)
{
  title: String
  price: Int
  quota: Int
  maxPerUser: Int
}

