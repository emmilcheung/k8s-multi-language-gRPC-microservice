}

type SeatingPlan
  @join__type(graph: TICKETS, key: "id", resolvable: false)
  @join__type(graph: VENUES, key: "id")
{
  id: ID!
  sections: [Section!]! @join__field(graph: VENUES)
  assignmentMode: AssignmentMode! @join__field(graph: VENUES)
