// Subset of the standard gRPC health protocol (grpc/health/v1/health.proto,
// Apache-2.0): only Check, which is what probes and the Go callers use.
// Kept package-compatible so any standard health client works unchanged.
syntax = "proto3";

package grpc.health.v1;

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}
