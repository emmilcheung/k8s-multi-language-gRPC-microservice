query TicketsBrowse($first: Int, $after: String, $filter: TicketFilter) {
  ticketsConnection(filter: $filter, first: $first, after: $after) {
    edges {
      node {
        id
        title
        price
        available
        ticketType
        category
        seatingPlan {
          id
        }
        event {
          title
          startsAt
          venueName
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
