query TicketDetail($id: ID!) {
  ticket(id: $id) {
    id
    title
    price
    priceDecimal
    userId
    orderId
    quota
    reserved
    sold
    available
    maxPerUser
    ticketType
    savedByMe
    seatingPlan {
      id
    }
    event {
      title
      description
      startsAt
      endsAt
      imageUrl
      venueName
      venueAddress
    }
  }
}
