query OrderPage($id: ID!) {
  order(id: $id) {
    id
    userId
    status
    quantity
    expiresAt
    createdAt
    ticket {
      id
      title
      price
    }
    seats {
      seatId
      sectionId
      seatLabel
      price
    }
    subtotal
    serviceFee
    facilityFee
    tax
    total
  }
  currentUser {
    id
    paymentMethods {
      id
      brand
      label
      last4
      expMonth
      expYear
      isDefault
    }
  }
}
