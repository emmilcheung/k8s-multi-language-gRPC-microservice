extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@external", "@tag"])

extend type User @key(fields: "id") {
  id: ID! @external
  paymentMethods: [PaymentMethod!]! @tag(name: "self-only")
}

type PaymentMethod {
  id: ID!
  brand: String
  label: String
  last4: String
  expMonth: Int
  expYear: Int
  isDefault: Boolean
}

type Payment @key(fields: "id") @key(fields: "orderId") {
  id: ID!
  orderId: ID!
  amount: Int!
  currency: String!
  status: PaymentStatus!
  createdAt: String!
}

enum PaymentStatus {
  PENDING
  CAPTURED
  FAILED
  REFUNDED
}

type Query {
  payment(id: ID!): Payment
}

type Mutation {
  createPayment(input: CreatePaymentInput!): Payment!
  requestRefund(input: RequestRefundInput!): RefundResult!
  setDefaultPaymentMethod(id: ID!): PaymentMethod!
  deletePaymentMethod(id: ID!): Boolean!
  registerPaymentMethod(input: RegisterPaymentMethodInput!): PaymentMethod!
}

input CreatePaymentInput {
  orderId: ID!
  token: String
  savedPaymentMethodId: ID
}

input RegisterPaymentMethodInput {
  providerPaymentMethodId: String!
  setAsDefault: Boolean
  consentAccepted: Boolean!
  consentVersion: String!
}

input RequestRefundInput {
  orderId: ID!
  reason: String!
}

type RefundResult {
  payment: Payment!
  refundId: ID!
  status: RefundStatus!
}

enum RefundStatus {
  REQUESTED
  PROCESSING
  COMPLETED
  FAILED
}
