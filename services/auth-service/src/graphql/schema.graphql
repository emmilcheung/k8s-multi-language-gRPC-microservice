extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@tag"])

type User @key(fields: "id") {
  id: ID!
  email: String @tag(name: "self-only")
}

type Session {
  id: ID!
  userAgent: String
  ipAddress: String
  createdAt: String!
  lastUsedAt: String
  current: Boolean!
}

type UserLookupResult {
  id: ID!
  email: String!
  displayName: String
}

type Query {
  currentUser: User
  sessions: [Session!]! @tag(name: "self-only")
  userLookup(email: String, id: ID): UserLookupResult
}

type Mutation {
  revokeSession(id: ID!): Boolean!
}
