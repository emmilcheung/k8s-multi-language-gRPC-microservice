version: v2
# buf.yaml — Buf CLI workspace configuration
# Docs: https://buf.build/docs/configuration/v2/buf-yaml
modules:
  - path: proto
    name: buf.build/acme/ticketing
lint:
  use:
    - DEFAULT
  except:
    # Allow java_outer_classname option (used by order-service Java codegen)
    - PACKAGE_VERSION_SUFFIX
    # Proto files live at proto/tickets/v1/ but package is acme.tickets.v1;
    # the directory layout predates this lint rule and renaming would break all consumers.
    - PACKAGE_DIRECTORY_MATCH
    # ValidateTicketRequest/Response names predate the standard RPC naming convention;
    # renaming them is a breaking proto change — suppressed until a v2 is cut.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  ignore_only:
    # google/ well-known types are externally managed; suppress path warnings
    IMPORT_NOT_USED:
      - google/protobuf/timestamp.proto
breaking:
  use:
    - FILE
  except:
    # Field presence changes are acceptable during development phase
    - FIELD_SAME_DEFAULT
  ignore_only:
    # C-08: price field intentionally changed from double to string for financial precision.
    # All consumers (ticket-service, order-service, client) have been updated accordingly.
    FIELD_SAME_TYPE:
      - proto/tickets/v1/tickets.proto
deps:
  - buf.build/googleapis/googleapis
