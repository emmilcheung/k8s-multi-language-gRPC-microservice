# CI pipeline for client (Next.js 16 / TypeScript / pnpm / Vitest / Playwright)
#
# Playwright E2E tests require the full stack running — they are NOT run in CI here.
# They are triggered separately in e2e.yml against a full Docker Compose stack on PRs to main.
# Stages: lint → unit test → build image → scan
# Image push is intentionally absent — no registry or deployment target exists yet.

name: ci-client

on:
  push:
    branches: ["**"]
    paths:
      - "services/client/**"
      - ".github/workflows/ci-client.yml"
  pull_request:
    paths:
      - "services/client/**"
      - ".github/workflows/ci-client.yml"

env:
  SERVICE: client
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/client

defaults:
  run:
    working-directory: services/client

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Run ESLint
        run: pnpm lint

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build & Scan Image
    runs-on: ubuntu-24.04
    needs: [lint, test-unit]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/client
          file: services/client/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/client.tar

      - name: Load image for scanning
        run: docker load --input /tmp/client.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

