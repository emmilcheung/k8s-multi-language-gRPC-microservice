# CI pipeline for order-service (Java 21 / Spring Boot / Maven)
#
# Build context is the REPO ROOT (not the service dir) because Maven reads
# ../../proto/ for protobuf code generation. The Dockerfile reflects this.
# Stages: lint(checkstyle) → unit test → integration test → build image → scan
# Image push is intentionally absent — no registry or deployment target exists yet.

name: ci-order-service

on:
  push:
    branches: ["**"]
    paths:
      - "services/order-service/**"
      - "proto/**"
      - ".github/workflows/ci-order-service.yml"
  pull_request:
    paths:
      - "services/order-service/**"
      - "proto/**"
      - ".github/workflows/ci-order-service.yml"

env:
  SERVICE: order-service
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/order-service

jobs:
  lint:
    name: Checkstyle / Compile
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/order-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile (validates proto generation + all sources)
        run: mvn --no-transfer-progress compile -DskipTests

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/order-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run unit tests
        # Exclude integration tests (those with @Tag("integration") or in IT* classes)
        run: mvn --no-transfer-progress test -Dgroups="!integration" -DskipITs

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/order-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run integration tests (Testcontainers — PostgreSQL + Kafka)
        run: mvn --no-transfer-progress verify -Dgroups="integration" -DfailIfNoTests=false
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

  build:
    name: Build & Scan Image
    runs-on: ubuntu-24.04
    needs: [lint, test-unit, test-integration]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is repo root — Dockerfile is in the service subdirectory
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/order-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/order-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/order-service.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

