# CI pipeline for proto definitions
#
# Runs buf lint and breaking-change detection on every push that touches .proto files.
# Breaking changes against the main branch fail CI unless the package version is bumped.
# Proto stubs are NOT regenerated here — use `make proto` locally.

name: ci-proto

on:
  push:
    branches: ["**"]
    paths:
      - "proto/**"
      - ".github/workflows/ci-proto.yml"
      - "buf.yaml"
      - "buf.gen.yaml"
  pull_request:
    paths:
      - "proto/**"
      - ".github/workflows/ci-proto.yml"
      - "buf.yaml"
      - "buf.gen.yaml"

jobs:
  lint:
    name: buf lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          version: "1.54.0"
          lint: true

  breaking:
    name: buf breaking (vs main)
    runs-on: ubuntu-24.04
    # Only run on PRs — compares the PR branch against the merge base on main
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          version: "1.54.0"
          breaking: true
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"
