  # ── summary gate (the single required branch-protection status check) ────────
  # Succeeds when every triggered job succeeded or was skipped.
  # Fails when any triggered job failed or was cancelled.
  # Configure branch protection to require: "ci / CI"
  # Compatibility note: some existing branch protection rules still require
  # "ci / CIExpected". Keep the alias job below until those rules are updated.
  # Note: deploy-* jobs are NOT included here — they run after the gate and are
  # optional (conditional on AWS_DEPLOY_ROLE_ARN). Only service CI jobs are gated.
  ci:
    name: CI
    runs-on: ubuntu-24.04
    if: always()
    needs: [changes, auth, client, expiration, graphql, helm-validate, kong, order, payment, proto, ticket, user, venue, e2e]
    steps:
      - name: Check all jobs passed (or skip if only markdown changed)
        run: |
          skip_ci='${{ needs.changes.outputs.skip-ci }}'
          if [ "$skip_ci" = "true" ]; then
            echo "✓ CI skipped — only markdown/docs files changed"
            exit 0
          fi
          
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          failed = [
            name for name, job in needs.items()
            if job['result'] not in ('success', 'skipped')
          ]
          if failed:
            print('Failed or cancelled jobs:', ', '.join(failed))
            sys.exit(1)
          print('All jobs passed or were skipped.')
          "

  ci-expected:
    name: CIExpected
    runs-on: ubuntu-24.04
    if: always()
    needs: [ci]
    steps:
      - name: Mirror summary gate result for legacy branch protection
        run: |
          result='${{ needs.ci.result }}'
          if [ "$result" != "success" ]; then
            echo "Legacy CIExpected gate failed because ci result was: $result"
            exit 1
          fi
          echo "Legacy CIExpected gate passed."
