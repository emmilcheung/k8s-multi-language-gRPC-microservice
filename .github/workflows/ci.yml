# Unified CI pipeline for all services and proto definitions.
#
# Structure
# ─────────
#   changes          — detect which paths were touched (dorny/paths-filter)
#   auth             — lint → unit → integration → build+scan  (runs if auth-service changed)
#   client           — lint → unit → build+scan                (runs if client changed)
#   expiration       — vet/lint → unit → integration → build+scan
#   order            — checkstyle/compile → unit → integration → build+scan
#   payment          — lint → unit → integration → build+scan
#   proto            — buf lint [+ buf breaking on PRs]
#   ticket           — vet/lint → unit → integration → build+scan
#   kong             — build.sh (renders kong.yml) → validate.sh (kong config parse via Docker)
#   deploy-dev       — helm upgrade to dev namespace (only on main; requires AWS_DEPLOY_ROLE_ARN)
#   deploy-staging   — helm upgrade to staging namespace (manual approval gate)
#   deploy-prod      — helm upgrade to prod namespace (manual approval gate)
#   ci               — summary gate: required branch-protection status check
#
# All service jobs run in parallel with each other.
# The final `ci` job is the single required status check configured in branch protection.
# It succeeds only when every triggered service job succeeded (or was skipped).
#
# Kafka and Redis integration tests use Testcontainers (Docker-in-Docker on ubuntu-24.04).
# No images are pushed — no registry credentials needed.
#
# Deploy stages (I-11):
#   - Conditional on secrets.AWS_DEPLOY_ROLE_ARN being set.
#   - Won't run on forks or in environments without real EKS infrastructure.
#   - staging and prod gates require manual approval (configure in repo Settings → Environments).

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── path filter ─────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      auth:       ${{ steps.filter.outputs.auth }}
      client:     ${{ steps.filter.outputs.client }}
      expiration: ${{ steps.filter.outputs.expiration }}
      graphql:    ${{ steps.filter.outputs.graphql }}
      helm:       ${{ steps.filter.outputs.helm }}
      kong:       ${{ steps.filter.outputs.kong }}
      order:      ${{ steps.filter.outputs.order }}
      payment:    ${{ steps.filter.outputs.payment }}
      proto:      ${{ steps.filter.outputs.proto }}
      ticket:     ${{ steps.filter.outputs.ticket }}
      user:       ${{ steps.filter.outputs.user }}
      venue:      ${{ steps.filter.outputs.venue }}
      skip-ci:    ${{ steps.set-skip-ci.outputs.skip-ci }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
              - '.github/workflows/ci.yml'
            client:
              - 'services/client/**'
              - '.github/workflows/ci.yml'
            expiration:
              - 'services/expiration-service/**'
              - '.github/workflows/ci.yml'
            graphql:
              - 'services/*/src/graphql/**'
              - 'services/*/internal/graphql/**'
              - 'services/*/src/main/resources/schema/**'
              - 'services/apollo-router/supergraph-config.yaml'
              - 'services/apollo-router/supergraph.graphql'
              - 'services/client/lib/graphql/operations/**'
            helm:
              - 'infra/helm/**'
              - '.github/workflows/ci.yml'
            kong:
              - 'services/kong-gateway/**'
              - '.github/workflows/ci.yml'
            order:
              - 'services/order-service/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            payment:
              - 'services/payment-service/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - '.github/workflows/ci.yml'
            ticket:
              - 'services/ticket-service/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            user:
              - 'services/user-service/**'
              - '.github/workflows/ci.yml'
            venue:
              - 'services/venue-service/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            # skip-ci: true if ONLY markdown/docs files changed (no code/config changes)
            ci-required:
              - 'services/**'
              - 'proto/**'
              - 'infra/**'
              - '.github/workflows/ci.yml'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'docker-compose.yml'

      - name: Set skip-ci output (true if only markdown/docs changed)
        id: set-skip-ci
        run: |
          if [ "${{ steps.filter.outputs.ci-required }}" == "false" ]; then
            echo "skip-ci=true" >> $GITHUB_OUTPUT
          else
            echo "skip-ci=false" >> $GITHUB_OUTPUT
          fi

  # ── auth-service (TypeScript / NestJS / pnpm / Vitest) ─────────────────────
  auth:
    name: auth-service
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: services/auth-service
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/auth-service
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/auth-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Testcontainers — PostgreSQL)
        run: pnpm test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          file: services/auth-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/auth-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/auth-service.tar
        working-directory: .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── client (Next.js 15 / TypeScript / pnpm / Vitest) ───────────────────────
  client:
    name: client
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.client == 'true'
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: services/client
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Validate GraphQL operations
        run: pnpm codegen

      - name: Enforce no inline GraphQL strings
        run: |
          if grep -rEn 'gql`|'"'"'[[:space:]]*(query|mutation|subscription|fragment)[[:space:]]'"'"'|"[[:space:]]*(query|mutation|subscription|fragment)[[:space:]]"' lib/ app/ 2>/dev/null; then
            echo "FAIL: inline gql strings found — move operations to lib/graphql/operations/"
            exit 1
          fi
          echo "OK: no inline gql strings"

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Browser-backed validation runs in the Playwright E2E job below.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/client
          file: services/client/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/client.tar

      - name: Load image for scanning
        run: docker load --input /tmp/client.tar
        working-directory: .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── expiration-service (Go 1.25 / asynq / confluent-kafka-go CGO) ──────────
  expiration:
    name: expiration-service
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.expiration == 'true'
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: services/expiration-service
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/expiration-service
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev librdkafka-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/expiration-service/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: services/expiration-service

      - name: Unit tests
        run: go test -v -count=1 -run "^Test" ./internal/...

      - name: Integration tests (Testcontainers — Redis + Kafka)
        run: go test -v -count=1 -timeout 5m ./test/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/expiration-service
          file: services/expiration-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/expiration-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/expiration-service.tar
        working-directory: .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── graphql (Apollo Router supergraph composition) ──────────────────────────
  graphql:
    name: GraphQL schema check
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.graphql == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rover home
        uses: actions/cache@v4
        with:
          path: ~/.rover
          key: rover-${{ runner.os }}-v0.38.1-supergraph-v2.9.0

      - name: Install Rover CLI
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: any
          command: |
            curl -sSL https://rover.apollo.dev/nix/latest | sh
            echo "$HOME/.rover/bin" >> "$GITHUB_PATH"

      - name: Verify Rover CLI
        run: |
          export PATH="$HOME/.rover/bin:$PATH"
          rover --version

      - name: Compose supergraph
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: any
          command: |
            export PATH="$HOME/.rover/bin:$PATH"
            rover supergraph compose \
              --config services/apollo-router/supergraph-config.yaml \
              --output /tmp/supergraph.graphql
            echo "Supergraph composed successfully"
        env:
          APOLLO_ELV2_LICENSE: accept

  # ── helm (rendered manifest lint) ────────────────────────────────────────────
  helm-validate:
    name: Helm rendered-manifest validation
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Enforce no latest tags in infra Helm values
        run: |
          if grep -RE "tag:\s*latest" infra/helm; then
            echo "FAIL: tag: latest is not allowed under infra/helm"
            exit 1
          fi
          echo "OK: no tag: latest found under infra/helm"

      - name: Validate rendered service charts with kubeconform
        run: |
          set -euo pipefail
          for chart in infra/helm/charts/*; do
            [ -d "${chart}" ] || continue
            chart_name="$(basename "${chart}")"
            echo "Validating ${chart_name}"
            helm template "${chart_name}" "${chart}" \
              --set global.serviceMesh.enabled=false \
              --set global.imageRegistry='' \
              | kubeconform -summary -strict -ignore-missing-schemas
          done

  # ── order-service (Java 21 / Spring Boot / Maven) ──────────────────────────
  # Build context is the REPO ROOT — Dockerfile reads ../../proto/ for protobuf codegen.
  order:
    name: order-service
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.order == 'true'
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/order-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile (validates proto generation + all sources)
        run: mvn --no-transfer-progress compile -DskipTests
        working-directory: services/order-service

      - name: Unit tests
        run: mvn --no-transfer-progress test -Dgroups="!integration" -DskipITs
        working-directory: services/order-service

      - name: Integration tests (Testcontainers — PostgreSQL + Kafka)
        run: mvn --no-transfer-progress verify -Dgroups="integration" -DfailIfNoTests=false
        working-directory: services/order-service
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is repo root — Dockerfile is in the service subdirectory
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/order-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/order-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/order-service.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── payment-service (TypeScript / NestJS / pnpm / Vitest) ──────────────────
  payment:
    name: payment-service
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.payment == 'true'
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: services/payment-service
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/payment-service
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/payment-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
        env:
          STRIPE_SECRET_KEY: sk_test_mock

      - name: Integration tests (Testcontainers — PostgreSQL + Kafka)
        run: pnpm test:integration
        env:
          STRIPE_SECRET_KEY: sk_test_mock
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/payment-service
          file: services/payment-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/payment-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/payment-service.tar
        working-directory: .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── user-service (TypeScript / NestJS / pnpm / Vitest) ────────────────────
  user:
    name: user-service
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.user == 'true'
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: services/user-service
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/user-service
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/user-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Testcontainers — PostgreSQL)
        run: pnpm test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/user-service
          file: services/user-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/user-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/user-service.tar
        working-directory: .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── proto (buf lint + breaking change detection) ────────────────────────────
  proto:
    name: proto
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: buf lint
        uses: bufbuild/buf-action@v1
        with:
          version: "1.54.0"
          lint: true
          push: false
          format: false

      - name: buf breaking (vs main)
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-action@v1
        with:
          version: "1.54.0"
          breaking: true
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

  # ── kong-gateway (build.sh → validate.sh) (I-15) ───────────────────────────
  kong:
    name: kong-gateway
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.kong == 'true'
    defaults:
      run:
        working-directory: services/kong-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Render kong.yml (build.sh local)
        run: bash scripts/build.sh local kong.yml
        env:
          # KONG_RSA_PUBLIC_KEY must be set in repo secrets.
          # The job is skipped on forks where the secret is unavailable.
          KONG_RSA_PUBLIC_KEY: ${{ secrets.KONG_RSA_PUBLIC_KEY }}
          KONG_SIGNING_KEY: ${{ secrets.X_USER_ID_SIGNING_KEY }}

      - name: Validate kong.yml (kong config parse via Docker)
        run: bash scripts/validate.sh kong.yml

  # ── ticket-service (Go 1.25 / Echo v4 / confluent-kafka-go CGO) ────────────
  ticket:
    name: ticket-service
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.ticket == 'true'
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: services/ticket-service
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ticket-service
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev librdkafka-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/ticket-service/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: services/ticket-service

      - name: Unit tests
        run: go test -v -count=1 -run "^Test" ./internal/...

      - name: Integration tests (Testcontainers — MongoDB + Kafka)
        run: go test -v -count=1 -timeout 5m ./test/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: any
          command: |
            docker buildx build \
              --file services/ticket-service/Dockerfile \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --output type=docker,dest=/tmp/ticket-service.tar \
              .

      - name: Load image for scanning
        run: docker load --input /tmp/ticket-service.tar
        working-directory: .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── venue-service (Go / Echo / CGO / Testcontainers — PostgreSQL) ───────────
  venue:
    name: venue-service
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.venue == 'true'
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: services/venue-service
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/venue-service
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev librdkafka-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/venue-service/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: services/venue-service

      - name: Unit tests
        run: go test -v -count=1 -run "^Test" ./internal/...

      - name: Integration tests (Testcontainers — PostgreSQL)
        run: go test -v -count=1 -timeout 5m ./test/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/venue-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/venue-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/venue-service.tar
        working-directory: .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── e2e (Playwright, runs after all service jobs pass on pull_request) ────────
  # Runs sequentially after every service CI job in this workflow. Only fires on
  # pull_request events (not on direct pushes to main). This means:
  #   - PRs cannot be merged until the full Playwright suite passes.
  #   - Push-to-main (post-merge) does not re-run E2E (cost/time saving).
  #
  # 'skipped' service jobs (path-filtered out) are acceptable — they did not
  # introduce a regression, so E2E can still proceed.
  #
  # NOTE: GitHub Actions secrets are unavailable on pull_request events from
  # forks. E2E will fail on fork PRs (missing RSA_PRIVATE_KEY etc.). This is
  # an acceptable trade-off for a private/internal repo; revisit if opening to
  # external contributors (use pull_request_target + explicit fork handling).
  e2e:
    name: Playwright E2E (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, auth, client, expiration, kong, order, payment, proto, ticket, user, venue]
    env:
      E2E_INFRA_SERVICES: postgres-auth postgres-orders postgres-payments postgres-attendance mongodb redis kafka schema-registry
      E2E_APP_SERVICES: auth-service ticket-service venue-service order-service payment-service expiration-service user-service attendance-service
    # Only run when:
    #   - The event is a pull_request (not a push to main)
    #   - Not a docs-only change (skip-ci == false)
    #   - No service job failed or was cancelled ('skipped' is fine)
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.skip-ci != 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - uses: actions/checkout@v4

      # Write the .env file consumed by docker-compose via env_file directives.
      # auth-service reads RSA_PRIVATE_KEY; payment-service reads STRIPE_SECRET_KEY.
      # RSA_PRIVATE_KEY and KONG_RSA_PUBLIC_KEY are stored as single-line \n-escaped
      # PEM strings; printf '%b' expands \n → real newlines for Docker Compose.
      - name: Write root .env
        run: |
          {
            printf 'RSA_PRIVATE_KEY="%b"\n' "$RSA_PRIVATE_KEY"
            printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
            printf 'KONG_RSA_PUBLIC_KEY="%b"\n' "$KONG_RSA_PUBLIC_KEY"
            printf 'X_USER_ID_SIGNING_KEY=%s\n' "$X_USER_ID_SIGNING_KEY"
            printf 'QR_SIGNING_KEY=%s\n' "${QR_SIGNING_KEY:-ci_qr_signing_key_32_bytes_minimum_length_value}"
          } > .env
        env:
          RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          KONG_RSA_PUBLIC_KEY: ${{ secrets.KONG_RSA_PUBLIC_KEY }}
          X_USER_ID_SIGNING_KEY: ${{ secrets.X_USER_ID_SIGNING_KEY }}
          QR_SIGNING_KEY: ${{ secrets.QR_SIGNING_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all service images
        run: docker compose build --parallel

      - name: Start backing infrastructure
        run: |
          docker compose up -d $E2E_INFRA_SERVICES
          # Give Kafka KRaft mode time to elect a controller before healthcheck polling begins
          sleep 30

      - name: Wait for infrastructure to be healthy
        run: |
          docker compose ps
          for service in $E2E_INFRA_SERVICES; do
            echo "Waiting for $service to be healthy..."
            timeout 120 bash -c "
              until [ \"\$(docker inspect \$(docker compose ps -q $service) --format='{{.State.Health.Status}}' 2>/dev/null)\" = 'healthy' ]; do
                sleep 5
              done
            "
            echo "$service is healthy"
          done

      - name: Cache Rover home
        uses: actions/cache@v4
        with:
          path: ~/.rover
          key: rover-${{ runner.os }}-v0.38.1-supergraph-v2.9.0

      - name: Install Rover CLI
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: any
          command: |
            curl -sSL https://rover.apollo.dev/nix/latest | sh
            echo "$HOME/.rover/bin" >> "$GITHUB_PATH"

      - name: Compose Apollo Router supergraph
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: any
          command: |
            export PATH="$HOME/.rover/bin:$PATH"
            bash services/apollo-router/scripts/compose.sh
        env:
          APOLLO_ELV2_LICENSE: accept

      - name: Start Apollo Router
        run: docker compose up -d apollo-router

      - name: Wait for Apollo Router to be healthy
        run: |
          echo "Waiting for apollo-router to be healthy..."
          timeout 120 bash -c '
            while true; do
              container_id=$(docker compose ps -q apollo-router 2>/dev/null)
              status=$(docker inspect "$container_id" --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}" 2>/dev/null || echo "not-started")
              if [ "$status" = "healthy" ]; then
                echo "apollo-router is healthy"
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "apollo-router became unhealthy"
                docker inspect "$container_id" --format="{{json .State.Health}}" || true
                docker logs "$container_id" || true
                exit 1
              fi
              echo "  apollo-router: $status"
              sleep 5
            done
          '

      - name: Start Kong and application services
        run: docker compose up -d kong $E2E_APP_SERVICES

      - name: Wait for Kong and application services to pass health checks
        run: |
          # Kong and each app service has a Docker healthcheck — poll until healthy.
          # order-service (Java/Spring Boot) is the slowest: can take 90-120s to start.
          # ticket-service must be healthy before order-service starts (depends_on),
          # so we allow up to 360s total for the entire chain to settle.
          echo "Waiting for Kong and all application services to be healthy..."
          timeout 360 bash -c "
            while true; do
              all_healthy=true
              for service in kong $E2E_APP_SERVICES; do
                status=\$(docker inspect \$(docker compose ps -q \$service 2>/dev/null) --format='{{.State.Health.Status}}' 2>/dev/null || echo 'not-started')
                if [ \"\$status\" != 'healthy' ]; then
                  all_healthy=false
                  echo \"  \$service: \$status\"
                fi
              done
              \$all_healthy && echo 'All services healthy!' && break
              sleep 5
            done
          "

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/client/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile --silent
        working-directory: services/client

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: services/client

      - name: Start Next.js dev server
        run: pnpm dev --port 4000 --hostname 0.0.0.0 &
        working-directory: services/client
        env:
          # NEXT_PUBLIC_API_URL: used by browser-side code to reach Kong
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # INTERNAL_API_URL: used by Next.js Server Actions (server-side fetch)
          # to reach Kong from the host runner. Without this it falls back to
          # localhost:8080 which doesn't exist, causing all Server Actions to fail.
          INTERNAL_API_URL: http://localhost:8000
          # NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: services/client/.env is gitignored;
          # E2E tests use a Stripe mock so any non-empty pk_test_ value works here.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

      - name: Wait for Next.js to be ready
        run: timeout 60 bash -c "until curl -sf http://localhost:4000; do sleep 2; done"

      - name: Run GraphQL federation security suite
        run: pnpm exec playwright test tests/e2e/graphql-federation.spec.ts
        working-directory: services/client
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4000

      - name: Run Playwright E2E tests
        run: pnpm exec playwright test
        working-directory: services/client
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: services/client/playwright-report/
          retention-days: 7

      - name: Capture docker compose logs
        if: always()
        run: docker compose logs --no-color > /tmp/compose-logs.raw.txt

      - name: Enforce secret-free compose logs
        if: always()
        run: |
          SECRET_PATTERN='STRIPE_SECRET|DATABASE_URL|SIGNING_KEY|REFRESH_TOKEN|JWT_SECRET|RSA_PRIVATE_KEY'
          if grep -qiE "$SECRET_PATTERN" /tmp/compose-logs.raw.txt; then
            echo "FAIL: secret-like pattern detected in compose logs"
            exit 1
          fi
          echo "OK: no secret-like patterns detected in compose logs"

      - name: Scrub compose logs for artifact upload
        if: always()
        run: bash audit/scripts/scrub-secrets.sh < /tmp/compose-logs.raw.txt > /tmp/compose-logs.txt

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt
          retention-days: 3

