# CI pipeline for expiration-service (Go 1.25 / asynq / confluent-kafka-go CGO)
#
# confluent-kafka-go requires CGO and librdkafka — same as ticket-service.
# Stages: vet/lint → unit test → integration test → build image → scan → push (main only)

name: ci-expiration-service

on:
  push:
    branches: ["**"]
    paths:
      - "services/expiration-service/**"
      - ".github/workflows/ci-expiration-service.yml"
  pull_request:
    paths:
      - "services/expiration-service/**"
      - ".github/workflows/ci-expiration-service.yml"

env:
  SERVICE: expiration-service
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/expiration-service
  CGO_ENABLED: "1"

defaults:
  run:
    working-directory: services/expiration-service

jobs:
  lint:
    name: Vet & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev librdkafka-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/expiration-service/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: services/expiration-service

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev librdkafka-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/expiration-service/go.sum

      - name: Run unit tests
        run: go test -v -count=1 -run "^Test" ./internal/...

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev librdkafka-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/expiration-service/go.sum

      - name: Run integration tests (Testcontainers — Redis + Kafka)
        run: go test -v -count=1 -timeout 5m ./test/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

  build:
    name: Build & Scan Image
    runs-on: ubuntu-24.04
    needs: [lint, test-unit, test-integration]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/expiration-service
          file: services/expiration-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/expiration-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/expiration-service.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  push:
    name: Push Image
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/expiration-service
          file: services/expiration-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
