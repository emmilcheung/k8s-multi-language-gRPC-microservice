# E2E test workflow (Playwright against Docker Compose stack)
#
# Runs the full 18-test Playwright suite after spinning up all services
# via docker-compose. Only runs on pushes to main and on PRs targeting main.
#
# Required secrets:
#   RSA_PRIVATE_KEY — the dev RSA private key (same value as in local .env)

name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Write the .env file so auth-service picks up RSA_PRIVATE_KEY via env_file
      - name: Write root .env
        run: |
          cat > .env <<'ENVEOF'
          RSA_PRIVATE_KEY="${{ secrets.RSA_PRIVATE_KEY }}"
          ENVEOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all service images
        run: docker compose build --parallel

      - name: Start backing infrastructure
        run: |
          docker compose up -d \
            postgres-auth postgres-orders postgres-payments \
            mongodb redis kafka schema-registry
          # Give Kafka time to elect a controller in KRaft mode
          sleep 20

      - name: Wait for infrastructure to be healthy
        run: |
          docker compose ps
          for service in postgres-auth postgres-orders postgres-payments mongodb redis kafka schema-registry; do
            echo "Waiting for $service..."
            timeout 60 bash -c "until docker compose exec -T $service sh -c 'exit 0' 2>/dev/null; do sleep 2; done"
          done

      - name: Start Kong and all application services
        run: docker compose up -d kong auth-service ticket-service order-service payment-service expiration-service

      - name: Wait for services to pass health checks
        run: |
          for service in auth-service ticket-service payment-service expiration-service; do
            echo "Waiting for $service..."
            timeout 90 bash -c "until docker compose exec -T $service wget -qO- http://localhost:$(docker compose port $service 80 2>/dev/null || echo '8080')/healthz/live 2>/dev/null; do sleep 3; done" || true
          done
          # Poll HTTP endpoints directly
          timeout 90 bash -c "until curl -sf http://localhost:3000/healthz/live; do sleep 3; done"
          timeout 90 bash -c "until curl -sf http://localhost:3001/healthz/live; do sleep 3; done"
          timeout 90 bash -c "until curl -sf http://localhost:3002/healthz/live; do sleep 3; done"
          timeout 90 bash -c "until curl -sf http://localhost:8082/actuator/health/liveness; do sleep 3; done"
          timeout 90 bash -c "until curl -sf http://localhost:8083/healthz/live; do sleep 3; done"
          timeout 90 bash -c "until curl -sf http://localhost:8000/; do sleep 3; done" || true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/client/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile --silent
        working-directory: services/client

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: services/client

      - name: Start Next.js dev server
        run: pnpm dev --port 4000 &
        working-directory: services/client
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Wait for Next.js to be ready
        run: timeout 60 bash -c "until curl -sf http://localhost:4000; do sleep 2; done"

      - name: Run Playwright E2E tests
        run: pnpm exec playwright test
        working-directory: services/client
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: services/client/playwright-report/
          retention-days: 7

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color > /tmp/compose-logs.txt && cat /tmp/compose-logs.txt

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt
          retention-days: 3
