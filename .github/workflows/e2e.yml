# E2E test workflow (Playwright against Docker Compose stack)
#
# Runs the full 18-test Playwright suite after spinning up all services
# via docker-compose. Only runs on PRs targeting main — not on pushes to main
# since there is no deployment pipeline to validate against.
#
# Required secrets:
#   RSA_PRIVATE_KEY    — the dev RSA private key (same value as in local .env)
#   STRIPE_SECRET_KEY  — Stripe key; use "test_mock" to activate mock mode

name: e2e

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Write the .env file consumed by docker-compose via env_file directives.
      # auth-service reads RSA_PRIVATE_KEY; payment-service reads STRIPE_SECRET_KEY.
      # Both were removed from docker-compose.yml hardcoded values in M2.
      #
      # RSA_PRIVATE_KEY and KONG_RSA_PUBLIC_KEY are stored in GitHub secrets as
      # single-line \n-escaped PEM strings. Docker Compose env_file requires real
      # newlines in multi-line values, so we use printf '%b' to expand \n → newline
      # and wrap the value in double quotes so Compose parses it as one value.
      - name: Write root .env
        run: |
          {
            printf 'RSA_PRIVATE_KEY="%b"\n' "$RSA_PRIVATE_KEY"
            printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
            printf 'KONG_RSA_PUBLIC_KEY="%b"\n' "$KONG_RSA_PUBLIC_KEY"
          } > .env
        env:
          RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          KONG_RSA_PUBLIC_KEY: ${{ secrets.KONG_RSA_PUBLIC_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all service images
        run: docker compose build --parallel

      - name: Start backing infrastructure
        run: |
          docker compose up -d \
            postgres-auth postgres-orders postgres-payments \
            mongodb redis kafka schema-registry
          # Give Kafka KRaft mode time to elect a controller before healthcheck polling begins
          sleep 30

      - name: Wait for infrastructure to be healthy
        run: |
          docker compose ps
          for service in postgres-auth postgres-orders postgres-payments mongodb redis kafka schema-registry; do
            echo "Waiting for $service to be healthy..."
            timeout 120 bash -c "
              until [ \"\$(docker inspect \$(docker compose ps -q $service) --format='{{.State.Health.Status}}' 2>/dev/null)\" = 'healthy' ]; do
                sleep 5
              done
            "
            echo "$service is healthy"
          done

      - name: Start Kong and all application services
        run: docker compose up -d kong auth-service ticket-service order-service payment-service expiration-service

      - name: Wait for services to pass health checks
        run: |
          # Each app service has a Docker healthcheck — poll until healthy.
          # order-service (Java/Spring Boot) is the slowest: can take 90-120s to start.
          # ticket-service must be healthy before order-service starts (depends_on),
          # so we allow up to 360s total for the entire chain to settle.
          echo "Waiting for all application services to be healthy..."
          timeout 360 bash -c "
            while true; do
              all_healthy=true
              for service in auth-service ticket-service order-service payment-service expiration-service; do
                status=\$(docker inspect \$(docker compose ps -q \$service 2>/dev/null) --format='{{.State.Health.Status}}' 2>/dev/null || echo 'not-started')
                if [ \"\$status\" != 'healthy' ]; then
                  all_healthy=false
                  echo \"  \$service: \$status\"
                fi
              done
              \$all_healthy && echo 'All services healthy!' && break
              sleep 5
            done
          "
          # Kong is optional for test routing — don't fail if it takes longer
          timeout 60 bash -c "until curl -sf http://localhost:8000/; do sleep 3; done" || true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/client/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile --silent
        working-directory: services/client

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: services/client

      - name: Start Next.js dev server
        run: pnpm dev --port 4000 &
        working-directory: services/client
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Wait for Next.js to be ready
        run: timeout 60 bash -c "until curl -sf http://localhost:4000; do sleep 2; done"

      - name: Run Playwright E2E tests
        run: pnpm exec playwright test
        working-directory: services/client
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: services/client/playwright-report/
          retention-days: 7

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color > /tmp/compose-logs.txt && cat /tmp/compose-logs.txt

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt
          retention-days: 3
