# CI pipeline for auth-service (TypeScript / NestJS / pnpm / Vitest)
#
# Stages: lint → unit test → integration test → build image → scan image
# Image push and deploy stages are gated on main branch only.
# Integration tests use Testcontainers (spawns real PostgreSQL via Docker-in-Docker).

name: ci-auth-service

on:
  push:
    branches: ["**"]
    paths:
      - "services/auth-service/**"
      - ".github/workflows/ci-auth-service.yml"
  pull_request:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

env:
  SERVICE: auth-service
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/auth-service

defaults:
  run:
    working-directory: services/auth-service

jobs:
  # ── lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/auth-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Run ESLint
        run: pnpm lint

  # ── unit tests ────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/auth-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Run unit tests
        run: pnpm test

  # ── integration tests ─────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/auth-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Run integration tests (Testcontainers)
        run: pnpm test:integration
        env:
          # Testcontainers needs Docker socket access — available on ubuntu-24.04 runners
          TESTCONTAINERS_RYUK_DISABLED: "false"

  # ── build image ───────────────────────────────────────────────────────────
  build:
    name: Build & Scan Image
    runs-on: ubuntu-24.04
    needs: [lint, test-unit, test-integration]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — all branches)
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          file: services/auth-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/auth-service.tar

      - name: Load image for scanning
        run: docker load --input /tmp/auth-service.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── push image (main only) ────────────────────────────────────────────────
  push:
    name: Push Image
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          file: services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
