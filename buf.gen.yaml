version: v2
# buf.gen.yaml — code generation configuration
# Run with: buf generate
# Regenerates gRPC stubs for all languages used in the platform.
# Output lands in libs/grpc-stubs/<lang>/ — committed to the repo so each
# service can import without running buf generate locally.
#
# Prerequisites (install once):
#   brew install bufbuild/buf/buf
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
#   npm install -g @bufbuild/protoc-gen-es @connectrpc/protoc-gen-connect-es
#
# Java (order-service) uses the Maven protobuf plugin at build time — no
# separate gen step required here.

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/org/ticketing/libs/grpc-stubs/go

plugins:
  # ── Go (ticket-service, expiration-service) ──────────────────────────────────
  - remote: buf.build/protocolbuffers/go
    out: libs/grpc-stubs/go
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go
    out: libs/grpc-stubs/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
