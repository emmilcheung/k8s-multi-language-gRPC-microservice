# Development infrastructure — all shared backing services
# Kafka runs in KRaft mode (no ZooKeeper) to keep resource use minimal.
# All services have mem_limit set for low-spec development machines.
# Do NOT use this compose file for production.

services:

  # ── PostgreSQL: auth-service ────────────────────────────────────────────────
  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # ── PostgreSQL: order-service ───────────────────────────────────────────────
  postgres-orders:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # ── PostgreSQL: payment-service ─────────────────────────────────────────────
  postgres-payments:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_user -d payments_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # ── PostgreSQL: venue-service ───────────────────────────────────────────────
  postgres-venue:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: venue_db
      POSTGRES_USER: venue_user
      POSTGRES_PASSWORD: venue_pass
    ports:
      - "5435:5432"
    volumes:
      - postgres_venue_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue_user -d venue_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # ── MongoDB: ticket-service ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tickets_db
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - microservices-net

  # ── Redis: expiration-service + Kong rate-limiting ──────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # ── Kafka (KRaft mode — no ZooKeeper) ──────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: INTERNAL for compose services, EXTERNAL for app containers on the ticketing bridge
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 10485760
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - microservices-net

  # ── Confluent Schema Registry ────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  # ── Kong API Gateway (DB-less, declarative) ────────────────────────────────
  # All external HTTP traffic enters through Kong on port 8000.
  # kong.yml is rendered at container startup from services/kong-gateway/
  # using the values/local.yml overrides and KONG_RSA_PUBLIC_KEY from .env.
  # Admin API is bound to 127.0.0.1:8001 only (not exposed publicly).
  kong:
    build:
      context: ./services/kong-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ── build.sh render env ───────────────────────────────────────────────
      KONG_ENV: local
      KONG_RSA_PUBLIC_KEY: "${KONG_RSA_PUBLIC_KEY}"
      # ── Kong runtime config ───────────────────────────────────────────────
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"   # public proxy — client → Kong
      - "8001:8001"   # admin API (localhost only)
    mem_limit: 256m
    # In CI, Next.js runs as a host process (not a Docker service).
    # host-gateway lets the kong container resolve "client" → Docker host IP,
    # so Kong can proxy / requests to http://client:4000 on the host.
    extra_hosts:
      - "client:host-gateway"
    depends_on:
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  # ── auth-service: Node.js / NestJS ──────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # RSA_PRIVATE_KEY is loaded from the root .env file (gitignored).
    # Copy .env.example → .env and populate RSA_PRIVATE_KEY before first run.
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://auth_user:auth_pass@postgres-auth:5432/auth_db
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

  # ── ticket-service: Go / Echo ────────────────────────────────────────────────
  ticket-service:
    build:
      # Context must be repo root: go.mod has a replace directive pointing to
      # ../../libs/grpc-stubs/go which is outside the service directory.
      context: .
      dockerfile: services/ticket-service/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 3001
      GRPC_PORT: 50051
      MONGO_URI: mongodb://mongo_user:mongo_pass@mongodb:27017/tickets_db?authSource=admin
      MONGO_DB: tickets
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

  # ── order-service: Java / Spring Boot ────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_ENVIRONMENT: development
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orders:5432/orders_db
      SPRING_DATASOURCE_USERNAME: orders_user
      SPRING_DATASOURCE_PASSWORD: orders_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
      TICKET_SERVICE_GRPC_HOST: ticket-service
      TICKET_SERVICE_GRPC_PORT: "50051"
      TICKET_SERVICE_GRPC_DEADLINE_MS: "5000"
      VENUE_SERVICE_GRPC_HOST: venue-service
      VENUE_SERVICE_GRPC_PORT: "50052"
    depends_on:
      postgres-orders:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

  # ── payment-service: Node.js / NestJS ────────────────────────────────────────
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # STRIPE_SECRET_KEY is loaded from the root .env file (gitignored).
    # Copy .env.example → .env and set STRIPE_SECRET_KEY before first run.
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://payments_user:payments_pass@postgres-payments:5432/payments_db
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      ORDER_SERVICE_URL: http://order-service:8082
    depends_on:
      postgres-payments:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - "3002:3002"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

  # ── venue-service: Go / Echo ─────────────────────────────────────────────────
  venue-service:
    build:
      # Context must be repo root: go.mod has a replace directive pointing to
      # ../../libs/grpc-stubs/go which is outside the service directory.
      context: .
      dockerfile: services/venue-service/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 3003
      GRPC_PORT: 50052
      DATABASE_URL: postgresql://venue_user:venue_pass@postgres-venue:5432/venue_db?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      postgres-venue:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

  # ── expiration-service: Go / asynq / Redis + Kafka ──────────────────────────
  expiration-service:
    build:
      context: ./services/expiration-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8083
      LOG_LEVEL: info
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

volumes:
  postgres_auth_data:
  postgres_orders_data:
  postgres_payments_data:
  postgres_venue_data:
  mongodb_data:
  redis_data:
  kafka_data:

networks:
  microservices-net:
    driver: bridge
    name: microservices-net
