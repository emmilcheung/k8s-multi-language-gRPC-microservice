  # ── ticket-service: Go / Echo ────────────────────────────────────────────────
  ticket-service:
    build:
      context: ./services/ticket-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 3001
      GRPC_PORT: 50051
      MONGO_URI: mongodb://mongo_user:mongo_pass@mongodb:27017/tickets_db?authSource=admin
      MONGO_DB: tickets
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3001:3001"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

  # ── order-service: Java / Spring Boot ────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_ENVIRONMENT: development
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orders:5432/orders_db
      SPRING_DATASOURCE_USERNAME: orders_user
      SPRING_DATASOURCE_PASSWORD: orders_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TICKET_SERVICE_GRPC_HOST: ticket-service
      TICKET_SERVICE_GRPC_PORT: "50051"
      TICKET_SERVICE_GRPC_DEADLINE_MS: "5000"
    depends_on:
      postgres-orders:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

  # ── payment-service: Node.js / NestJS ────────────────────────────────────────
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://payments_user:payments_pass@postgres-payments:5432/payments_db
      STRIPE_SECRET_KEY: "sk_test_4eC39HqLyjWDarhtT1ZdV7xY"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      ORDER_SERVICE_URL: http://order-service:8082
    depends_on:
      postgres-payments:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - "3002:3002"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

volumes:
  postgres_auth_data:
  postgres_orders_data:
  postgres_payments_data:
  mongodb_data:
  redis_data:
  kafka_data:

networks:
  microservices-net:
    driver: bridge
    name: microservices-net
