global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: apollo-router
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: [kong:8100]

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: [auth-service:3000]

  - job_name: ticket-service
    metrics_path: /metrics
    static_configs:
      - targets: [ticket-service:3001]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8082]

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: [payment-service:3002]

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: [user-service:3004]

  - job_name: venue-service
    metrics_path: /metrics
    static_configs:
      - targets: [venue-service:3003]

  - job_name: expiration-service
    metrics_path: /metrics
    static_configs:
      - targets: [expiration-service:8083]